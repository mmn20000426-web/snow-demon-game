<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>直向彈幕大作戰</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* 遊戲區域居中 */
        #game-container {
            position: relative;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background: #0d0f18;
            display: block;
            cursor: crosshair;
        }
        
        /* 🎛️ 控制面板：浮動於右上方，預設隱藏 (按 I 鍵切換) */
        #control-panel {
            display: none; /* 預設隱藏 */
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 34, 48, 0.95);
            border: 2px solid #333a4e;
            border-radius: 8px;
            padding: 15px;
            width: 260px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            max-height: 80vh;
            overflow-y: auto;
            z-index: 999;
        }
        #control-panel h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #FFD700;
            border-bottom: 1px solid #333a4e;
            padding-bottom: 6px;
            text-align: center;
            font-size: 16px;
        }
        .panel-section {
            margin-bottom: 12px;
        }
        .panel-section h4 {
            margin: 6px 0;
            color: #2ed573;
            font-size: 13px;
        }
        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .toggle-item label {
            cursor: pointer;
        }
        .toggle-item input[type="checkbox"] {
            cursor: pointer;
            width: 15px;
            height: 15px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .panel-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .panel-btn:hover {
            background: #2980b9;
        }
        .panel-btn.success {
            background: #2ed573;
            color: #111;
        }
        .panel-btn.success:hover {
            background: #26af5f;
        }
        .panel-btn.danger {
            background: #e74c3c;
        }
        .panel-btn.danger:hover {
            background: #c0392b;
        }

        .instructions {
            margin-top: 12px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h2>🚀 彈幕大作戰！</h2>

<div id="game-container">
    <canvas id="gameCanvas" width="650" height="650"></canvas>
</div>

<div id="control-panel">
    <h3>🎛️ 控制台 (按 [I] 關閉)</h3>
    
    <div class="panel-section">
        <h4>⚡ 即時狀態控制</h4>
        <div class="toggle-item">
            <label for="sw-pause-boss" style="color:#ff6b6b; font-weight:bold;">⏸️ 暫停 Boss 移動/攻擊</label>
            <input type="checkbox" id="sw-pause-boss">
        </div>
        <button class="panel-btn success" style="width: 100%; margin-top: 5px;" onclick="healPlayerToFull()">💚 補滿玩家血量</button>
    </div>

    <div class="panel-section">
        <h4>自動釋放開關</h4>
        <div class="toggle-item">
            <label for="sw-orange">橘色扇形彈幕</label>
            <input type="checkbox" id="sw-orange" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-green">綠色長條彈幕</label>
            <input type="checkbox" id="sw-green" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-brown">咖啡圓形彈幕</label>
            <input type="checkbox" id="sw-brown" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-pudding">追蹤布丁（封印區）</label>
            <input type="checkbox" id="sw-pudding" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-laser">黃色雷射 (4.5s)</label>
            <input type="checkbox" id="sw-laser" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-burger">漢堡肉 (6s)</label>
            <input type="checkbox" id="sw-burger" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-noodle">麵條牆 (6s)</label>
            <input type="checkbox" id="sw-noodle" checked>
        </div>
        <div class="toggle-item">
            <label for="sw-medkit">急救包 Medkit (4s)</label>
            <input type="checkbox" id="sw-medkit" checked>
        </div>
    </div>

    <div class="panel-section">
        <h4>手動即時觸發</h4>
        <div class="btn-grid">
            <button class="panel-btn" onclick="triggerLaser()">發射雷射</button>
            <button class="panel-btn" onclick="triggerNoodles()">召喚麵條</button>
            <button class="panel-btn" onclick="triggerBurger()">丟漢堡肉</button>
            <button class="panel-btn" onclick="triggerMedkit()">掉落Medkit</button>
        </div>
    </div>

    <div class="panel-section">
        <h4>除錯功能</h4>
        <button class="panel-btn danger" style="width: 100%;" onclick="clearEnemyBullets()">清空敵方子彈</button>
    </div>
</div>

<div class="instructions">
    <p>🎮 <b>操作說明：</b> [WASD/方向鍵] 移動 | [空白鍵] 發射子彈<br>(按 <b>[U]</b> 護盾 | 按 <b>[I]</b> 開啟/關閉控制面板 | 按 <b>[P]</b> 測試勝利)</p>
</div>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<audio id="loseBgm" src="lose.mp3" preload="auto"></audio>
<audio id="winBgm" src="win.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const bgm = document.getElementById('bgm');
const loseBgm = document.getElementById('loseBgm');
const winBgm = document.getElementById('winBgm');

// 地圖遊玩區域
const playArea = {
    left: 100,
    right: 550,
    width: 450
};

// --- 載入圖片 ---
const imgPlayer = new Image(); imgPlayer.src = 'player.jpg';
const imgBoss = new Image(); imgBoss.src = 'boss.jpg';
const imgGameOver = new Image(); imgGameOver.src = 'boss.jpg';  
const imgWin = new Image(); imgWin.src = 'win.jpg';
const imgShield = new Image(); imgShield.src = 'shield.jpg';
const imgMedkit = new Image(); imgMedkit.src = 'medkit.jpg';

// 載入 NPC 圖片
const npcImages = {
    npc1: new Image(), npc2: new Image(), npc3: new Image(),
    bnpc1: new Image(), bnpc2: new Image(), bnpc3: new Image()
};
npcImages.npc1.src = 'npc1.jpg';
npcImages.npc2.src = 'npc2.jpg';
npcImages.npc3.src = 'npc3.jpg';
npcImages.bnpc1.src = 'bnpc1.jpg';
npcImages.bnpc2.src = 'bnpc2.jpg';
npcImages.bnpc3.src = 'bnpc3.jpg';

// --- 遊戲狀態 ---
let gameStarted = false;
let score = 0;
let gameOver = false;
let gameWin = false;
let frameCount = 0;

const keys = {};

// NPC3 護盾台詞定時器
let npc3SpecialTextTimer = null;
let isNpc3SpecialText = false;

// Boss 下方的空氣牆邊界 (玩家不可越過 y < 140 的區域)
const bossWallY = 140;

// --- 角色與陣列 ---
const player = {
    x: playArea.left + playArea.width / 2 - 25,
    y: canvas.height - 90,
    width: 50,
    height: 50,
    baseSpeed: 6,
    speed: 6,
    radius: 10,
    hp: 25,
    maxHp: 25,
    invincibleFrame: 0
};

const boss = {
    x: playArea.left + playArea.width / 2 - 40,
    y: 40,
    width: 80,
    height: 80,
    dir: 1,
    speed: 2.5,
    hp: 75,
    maxHp: 75
};

const shields = [];
const enemyBullets = [];  
const playerBullets = []; 
const puddings = [];       
const sealZones = [];      
const burgerSteaks = [];   
const noodles = [];        
const medkits = [];        

// 雷射狀態
let laserTimer = 0;
let isLaserActive = false;
let laserDuration = 0;

// 切換控制面板顯示/隱藏
function toggleControlPanel() {
    const panel = document.getElementById('control-panel');
    if (panel.style.display === 'none' || panel.style.display === '') {
        panel.style.display = 'block';
    } else {
        panel.style.display = 'none';
    }
}

// 補滿血量
function healPlayerToFull() {
    player.hp = player.maxHp;
}

// 手動觸發技能函式
function triggerLaser() {
    isLaserActive = true;
    laserDuration = 45;
}

function triggerNoodles() {
    for (let i = 0; i < 4; i++) {
        noodles.push({
            x: Math.random() * (playArea.width - 40) + playArea.left + 20,
            y: Math.random() * (canvas.height - 300) + 180,
            width: 16,
            height: 70,
            duration: 120
        });
    }
}

function triggerBurger() {
    const startX = boss.x + boss.width / 2;
    const startY = boss.y + boss.height;
    const targetX = Math.random() * (playArea.width - 80) + playArea.left + 40;
    const targetY = Math.random() * (canvas.height - 250) + 150;
    const angle = Math.atan2(targetY - startY, targetX - startX);

    burgerSteaks.push({
        x: startX,
        y: startY,
        targetX: targetX,
        targetY: targetY,
        vx: Math.cos(angle) * 7,
        vy: Math.sin(angle) * 7,
        width: 38,
        height: 26,
        isStationary: false,
        stayDuration: 180
    });
}

function triggerMedkit() {
    medkits.push({
        x: Math.random() * (playArea.width - 35) + playArea.left + 15,
        y: -30,
        vy: 2.5,
        width: 30,
        height: 30
    });
}

function clearEnemyBullets() {
    enemyBullets.length = 0;
}

function spawnEnemyBullets() {
    const isBossPaused = document.getElementById('sw-pause-boss').checked;
    if (isBossPaused) return; // 若暫停 Boss 則不發射任何技能與彈幕

    // 開關讀取
    const swOrange = document.getElementById('sw-orange').checked;
    const swGreen = document.getElementById('sw-green').checked;
    const swBrown = document.getElementById('sw-brown').checked;
    const swPudding = document.getElementById('sw-pudding').checked;
    const swLaser = document.getElementById('sw-laser').checked;
    const swBurger = document.getElementById('sw-burger').checked;
    const swNoodle = document.getElementById('sw-noodle').checked;
    const swMedkit = document.getElementById('sw-medkit').checked;

    // 橘色長方形彈幕
    if (swOrange && frameCount % 25 === 0) {
        const count = 3;
        const startAngle = Math.PI * 0.35;
        const endAngle = Math.PI * 0.65;
        const step = count > 1 ? (endAngle - startAngle) / (count - 1) : 0;

        for (let i = 0; i < count; i++) {
            const angle = startAngle + step * i;
            enemyBullets.push({
                x: boss.x + boss.width / 2,
                y: boss.y + boss.height,
                vx: Math.cos(angle) * 4,
                vy: Math.sin(angle) * 4,
                width: 35,
                height: 10,
                angle: angle,
                color: '#FF7F50', 
                type: 'rect',
                damage: 1
            });
        }
    }

    // 綠色垂直長條彈幕
    if (swGreen && frameCount % 28 === 0) {
        enemyBullets.push({
            x: Math.random() * (playArea.width - 30) + playArea.left + 15,
            y: 0,
            vx: 0,       
            vy: 7,       
            width: 12,   
            height: 45,  
            angle: 0,    
            color: '#2ed573', 
            type: 'rect',
            damage: 1
        });
    }

    // 咖啡色圓形彈幕
    if (swBrown && frameCount % 20 === 0) {
        enemyBullets.push({
            x: boss.x + boss.width / 2,
            y: boss.y + boss.height,
            vx: (Math.random() - 0.5) * 3,
            vy: 5,
            radius: 6,
            color: '#8B4513',
            type: 'circle',
            damage: 1
        });
    }

    // 布丁技能
    if (swPudding && frameCount % 180 === 0) {
        const targetX = player.x + player.width / 2;
        const targetY = player.y + player.height / 2;
        const startX = boss.x + boss.width / 2;
        const startY = boss.y + boss.height;
        const angle = Math.atan2(targetY - startY, targetX - startX);

        puddings.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle) * 5,
            vy: Math.sin(angle) * 5,
            radius: 16
        });
    }

    // 雷射技能
    if (swLaser) {
        laserTimer++;
        if (laserTimer >= 270) {
            triggerLaser();
            laserTimer = 0;
        }
    }

    // 漢堡肉技能
    if (swBurger && frameCount % 360 === 0) {
        triggerBurger();
    }

    // 麵條技能
    if (swNoodle && frameCount % 360 === 0) {
        triggerNoodles();
    }

    // Medkit 技能
    if (swMedkit && frameCount % 240 === 0) {
        triggerMedkit();
    }
}

function firePlayerBullet() {
    playerBullets.push({
        x: player.x + player.width / 2,
        y: player.y,
        vy: -10,
        radius: 5,
        color: '#FFD700'
    });
}

function trySummonShield() {
    shields.push({
        x: player.x + player.width / 2 - 25,
        y: player.y - 50,
        width: 50,
        height: 45
    });

    isNpc3SpecialText = true;
    if (npc3SpecialTextTimer) clearTimeout(npc3SpecialTextTimer);
    npc3SpecialTextTimer = setTimeout(() => {
        isNpc3SpecialText = false;
    }, 1500); // 展示咒語 1.5 秒
}

function playBGM() {
    if (gameStarted && !gameOver && !gameWin) {
        bgm.play().catch(() => {});
    }
}

function playLoseBGM() {
    bgm.pause();
    bgm.currentTime = 0;
    loseBgm.currentTime = 0;
    loseBgm.play().catch(() => {});
}

function triggerWin() {
    boss.hp = 0;
    gameWin = true;
    bgm.pause();
    bgm.currentTime = 0;
    winBgm.currentTime = 0;
    winBgm.play().catch(() => {});
}

function startGame() {
    if (!gameStarted) {
        gameStarted = true;
        playBGM();
    }
}

// --- 事件處理 ---
window.addEventListener('keydown', e => {
    startGame();
    keys[e.key] = true;
    keys[e.code] = true;

    if (e.key === 'u' || e.key === 'U' || e.code === 'KeyU') {
        if (!gameOver && !gameWin) trySummonShield();
    }

    if (e.key === 'i' || e.key === 'I' || e.code === 'KeyI') {
        toggleControlPanel();
    }

    if (e.key === 'p' || e.key === 'P' || e.code === 'KeyP') {
        if (!gameOver && !gameWin) triggerWin();
    }

    if ((gameOver || gameWin) && (e.code === 'Space' || e.code === 'Enter')) {
        resetGame();
    }
});

window.addEventListener('keyup', e => {
    keys[e.key] = false;
    keys[e.code] = false;
});

let isDragging = false;
canvas.addEventListener('mousedown', e => {
    startGame();
    if (gameOver || gameWin) {
        resetGame();
        return;
    }
    isDragging = true;
    updatePlayerPos(e);
});

canvas.addEventListener('mousemove', e => {
    if (isDragging && !gameOver && !gameWin) updatePlayerPos(e);
});

window.addEventListener('mouseup', () => isDragging = false);

canvas.addEventListener('touchstart', e => {
    startGame();
    if (gameOver || gameWin) {
        resetGame();
        return;
    }
    isDragging = true;
    updatePlayerPos(e.touches[0]);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    if (isDragging && !gameOver && !gameWin) {
        updatePlayerPos(e.touches[0]);
        e.preventDefault();
    }
}, { passive: false });

window.addEventListener('touchend', () => isDragging = false);

function updatePlayerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const touchX = evt.clientX - rect.left;
    const touchY = evt.clientY - rect.top;
    player.x = touchX - player.width / 2;
    player.y = touchY - player.height / 2;
}

function resetGame() {
    score = 0;
    gameOver = false;
    gameWin = false;
    frameCount = 0;
    enemyBullets.length = 0;
    playerBullets.length = 0;
    shields.length = 0;
    puddings.length = 0;
    sealZones.length = 0;
    burgerSteaks.length = 0;
    noodles.length = 0;
    medkits.length = 0;
    laserTimer = 0;
    isLaserActive = false;
    laserDuration = 0;

    player.x = playArea.left + playArea.width / 2 - 25;
    player.y = canvas.height - 90;
    player.hp = player.maxHp;
    player.invincibleFrame = 0;
    player.speed = player.baseSpeed;
    boss.x = playArea.left + playArea.width / 2 - 40;
    boss.hp = boss.maxHp;

    isNpc3SpecialText = false;
    if (npc3SpecialTextTimer) clearTimeout(npc3SpecialTextTimer);

    loseBgm.pause(); loseBgm.currentTime = 0;
    winBgm.pause(); winBgm.currentTime = 0;
    bgm.currentTime = 0;
    playBGM();
}

function checkPointRectCollision(px, py, rect) {
    if (rect.type === 'circle') {
        const dx = px - rect.x;
        const dy = py - rect.y;
        return Math.sqrt(dx * dx + dy * dy) < rect.radius + player.radius;
    } else {
        const halfW = (rect.width || 20) / 2;
        const halfH = (rect.height || 10) / 2;
        return (
            px > rect.x - halfW - 4 &&
            px < rect.x + halfW + 4 &&
            py > rect.y - halfH - 4 &&
            py < rect.y + halfH + 4
        );
    }
}

function checkAABBCollision(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
    );
}

function checkShieldCollision(shield, eb) {
    const w = eb.width || (eb.radius * 2);
    const h = eb.height || (eb.radius * 2);
    return (
        eb.x + w / 2 > shield.x &&
        eb.x - w / 2 < shield.x + shield.width &&
        eb.y + h / 2 > shield.y &&
        eb.y - h / 2 < shield.y + shield.height
    );
}

function update() {
    if (!gameStarted || gameOver || gameWin) return;

    frameCount++;
    score++;

    if (player.invincibleFrame > 0) player.invincibleFrame--;

    // 檢查玩家是否進入封印區
    let inSeal = false;
    const playerCenterX = player.x + player.width / 2;
    const playerCenterY = player.y + player.height / 2;

    for (let i = sealZones.length - 1; i >= 0; i--) {
        const zone = sealZones[i];
        zone.duration--;
        
        const dx = playerCenterX - zone.x;
        const dy = playerCenterY - zone.y;
        if (Math.sqrt(dx * dx + dy * dy) < zone.radius) {
            inSeal = true;
        }

        if (zone.duration <= 0) {
            sealZones.splice(i, 1);
        }
    }

    player.speed = inSeal ? player.baseSpeed * 0.4 : player.baseSpeed;

    const oldX = player.x;
    const oldY = player.y;

    if (keys['ArrowLeft'] || keys['a'] || keys['A'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D'] || keys['KeyD']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S'] || keys['KeyS']) player.y += player.speed;

    if ((keys['Space'] || keys['KeySpace']) && frameCount % 8 === 0) firePlayerBullet();
    if (isDragging && frameCount % 8 === 0) firePlayerBullet();

    player.x = Math.max(playArea.left, Math.min(playArea.right - player.width, player.x));
    player.y = Math.max(bossWallY, Math.min(canvas.height - player.height, player.y));

    for (let nd of noodles) {
        if (checkAABBCollision(player, nd)) {
            player.x = oldX;
            player.y = oldY;
            break;
        }
    }

    shields.forEach(s => {
        s.x = player.x + player.width / 2 - s.width / 2;
        s.y = player.y - s.height - 5;
    });

    // 暫停 Boss 邏輯判斷
    const isBossPaused = document.getElementById('sw-pause-boss').checked;
    if (!isBossPaused) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= playArea.left + 10 || boss.x + boss.width >= playArea.right - 10) {
            boss.dir *= -1;
        }
    }

    spawnEnemyBullets();

    for (let i = noodles.length - 1; i >= 0; i--) {
        noodles[i].duration--;
        if (noodles[i].duration <= 0) {
            noodles.splice(i, 1);
        }
    }

    for (let i = medkits.length - 1; i >= 0; i--) {
        const m = medkits[i];
        m.y += m.vy;

        if (checkAABBCollision(player, m)) {
            player.hp = Math.min(player.maxHp, player.hp + 1);
            medkits.splice(i, 1);
            continue;
        }

        if (m.y > canvas.height + 50) {
            medkits.splice(i, 1);
        }
    }

    if (isLaserActive) {
        laserDuration--;
        const laserX = boss.x + boss.width / 2;
        const laserWidth = 30;

        if (
            player.invincibleFrame === 0 &&
            playerCenterX > laserX - laserWidth / 2 &&
            playerCenterX < laserX + laserWidth / 2 &&
            playerCenterY > boss.y + boss.height
        ) {
            player.hp -= 2;
            player.invincibleFrame = 30;
            if (player.hp <= 0) {
                gameOver = true;
                playLoseBGM();
                return;
            }
        }

        if (laserDuration <= 0) {
            isLaserActive = false;
        }
    }

    for (let i = burgerSteaks.length - 1; i >= 0; i--) {
        const b = burgerSteaks[i];

        if (!b.isStationary) {
            b.x += b.vx;
            b.y += b.vy;

            const distToTarget = Math.sqrt(Math.pow(b.x - b.targetX, 2) + Math.pow(b.y - b.targetY, 2));
            if (distToTarget < 10) {
                b.x = b.targetX;
                b.y = b.targetY;
                b.isStationary = true;
            }
        } else {
            b.stayDuration--;
            if (b.stayDuration <= 0) {
                burgerSteaks.splice(i, 1);
                continue;
            }
        }

        enemyBullets.forEach(eb => {
            if (
                eb.x > b.x - b.width / 2 && eb.x < b.x + b.width / 2 &&
                eb.y > b.y - b.height / 2 && eb.y < b.y + b.height / 2
            ) {
                eb.damage = 2;
                eb.isEnhanced = true;
            }
        });
    }

    for (let i = puddings.length - 1; i >= 0; i--) {
        const p = puddings[i];
        p.x += p.vx;
        p.y += p.vy;

        const dx = playerCenterX - p.x;
        const dy = playerCenterY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let hitPlayer = false;
        if (player.invincibleFrame === 0 && dist < p.radius + player.radius) {
            player.hp -= 2;
            player.invincibleFrame = 30;
            hitPlayer = true;

            if (player.hp <= 0) {
                gameOver = true;
                playLoseBGM();
                return;
            }
        }

        if (hitPlayer || p.y >= canvas.height - 20 || p.x <= playArea.left || p.x >= playArea.right) {
            sealZones.push({
                x: p.x,
                y: p.y,
                radius: 45,
                duration: 180
            });
            puddings.splice(i, 1);
        }
    }

    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const pb = playerBullets[i];
        pb.y += pb.vy;

        if (
            pb.x > boss.x &&
            pb.x < boss.x + boss.width &&
            pb.y > boss.y &&
            pb.y < boss.y + boss.height
        ) {
            boss.hp--;
            playerBullets.splice(i, 1);

            if (boss.hp <= 0) {
                triggerWin();
                return;
            }
            continue;
        }

        if (pb.y < -10) playerBullets.splice(i, 1);
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        let blockedByShield = false;
        for (let j = shields.length - 1; j >= 0; j--) {
            if (checkShieldCollision(shields[j], eb)) {
                shields.splice(j, 1);
                enemyBullets.splice(i, 1);
                blockedByShield = true;
                break;
            }
        }

        if (blockedByShield) continue;

        if (player.invincibleFrame === 0) {
            if (checkPointRectCollision(playerCenterX, playerCenterY, eb)) {
                player.hp -= (eb.damage || 1);
                player.invincibleFrame = 30;
                enemyBullets.splice(i, 1);

                if (player.hp <= 0) {
                    gameOver = true;
                    playLoseBGM();
                    return;
                }
                continue;
            }
        }

        if (eb.y > canvas.height + 50 || eb.y < -50 || eb.x < -50 || eb.x > canvas.width + 50) {
            enemyBullets.splice(i, 1);
        }
    }
}

function drawWineGlass(x, y) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x - 12, y - 25);
    ctx.lineTo(x + 12, y - 25);
    ctx.lineTo(x, y - 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y - 10);
    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - 10, y);
    ctx.lineTo(x + 10, y);
    ctx.stroke();

    ctx.restore();
}

function drawSpeechBubble(text, x, y, alignLeft = true) {
    ctx.save();
    ctx.font = 'bold 11px "Microsoft JhengHei", Arial';
    const textWidth = ctx.measureText(text).width;
    const padding = 6;
    const bubbleW = textWidth + padding * 2;
    const bubbleH = 22;
    
    let bubbleX = alignLeft ? x + 10 : x - bubbleW - 10;
    let bubbleY = y - 10;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(bubbleX, bubbleY, bubbleW, bubbleH, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.textAlign = 'center';
    ctx.fillText(text, bubbleX + bubbleW / 2, bubbleY + 15);
    ctx.restore();
}

function drawAllNPCs() {
    const npcW = 55;
    const npcH = 55;
    const leftX = 20;
    const rightX = 575;

    const leftPositions = [
        { key: 'npc1', y: 120 },
        { key: 'npc2', y: 280 },
        { key: 'npc3', y: 440 }
    ];

    const rightPositions = [
        { key: 'bnpc1', y: 120 },
        { key: 'bnpc2', y: 280 },
        { key: 'bnpc3', y: 440 }
    ];

    leftPositions.forEach(item => {
        let text = "我修院加油啊!"; // 左側戰鬥時台詞更新
        if (gameOver) {
            text = "哎呀!!害死我力";
        } else if (gameWin) {
            text = "好結局";
        } else if (item.key === 'npc3' && isNpc3SpecialText) {
            text = "鴨蛋摸鴨蛋，牡蠣摸牡蠣"; // NPC3 按 U 時的招式台詞
        }

        const img = npcImages[item.key];
        if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, leftX, item.y, npcW, npcH);
        } else {
            ctx.fillStyle = '#9b59b6';
            ctx.fillRect(leftX, item.y, npcW, npcH);
        }
        drawSpeechBubble(text, leftX + npcW / 2, item.y - 12, true);
    });

    rightPositions.forEach(item => {
        let text = "淳平君加油啊!";
        if (gameOver) {
            text = "哎呀!!害死我力";
        } else if (gameWin) {
            text = "壞結局";
        }

        const img = npcImages[item.key];
        if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, rightX, item.y, npcW, npcH);
        } else {
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(rightX, item.y, npcW, npcH);
        }
        drawSpeechBubble(text, rightX + npcW / 2, item.y - 12, false);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    for (let i = 0; i < 20; i++) {
        const sx = (Math.sin(i * 99 + frameCount * 0.05) * 0.5 + 0.5) * canvas.width;
        const sy = ((i * 35 + frameCount * 3) % canvas.height);
        ctx.fillRect(sx, sy, 2, 2);
    }

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playArea.left, 0); ctx.lineTo(playArea.left, canvas.height);
    ctx.moveTo(playArea.right, 0); ctx.lineTo(playArea.right, canvas.height);
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 71, 87, 0.6)';
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(playArea.left, bossWallY);
    ctx.lineTo(playArea.right, bossWallY);
    ctx.stroke();
    ctx.restore();

    sealZones.forEach(z => {
        ctx.fillStyle = 'rgba(211, 84, 0, 0.35)';
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#e67e22';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#f39c12';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('封印中', z.x, z.y + 4);
    });

    noodles.forEach(nd => {
        ctx.save();
        ctx.fillStyle = '#F1C40F';
        ctx.strokeStyle = '#D35400';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(nd.x, nd.y, nd.width, nd.height, 8);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    });

    medkits.forEach(m => {
        if (imgMedkit.complete && imgMedkit.naturalWidth !== 0) {
            ctx.drawImage(imgMedkit, m.x, m.y, m.width, m.height);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(m.x, m.y, m.width, m.height);
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(m.x + 12, m.y + 5, 6, 20);
            ctx.fillRect(m.x + 5, m.y + 12, 20, 6);
        }
    });

    if (isLaserActive) {
        const laserX = boss.x + boss.width / 2;
        
        ctx.fillStyle = 'rgba(255, 242, 0, 0.3)';
        ctx.fillRect(laserX - 22, boss.y + boss.height, 44, canvas.height);

        ctx.fillStyle = '#FFD700';
        ctx.fillRect(laserX - 12, boss.y + boss.height, 24, canvas.height);

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(laserX - 4, boss.y + boss.height, 8, canvas.height);

        drawWineGlass(laserX, boss.y - 5);
    }

    if (!gameStarted) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 26px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('點擊螢幕 / 按任意鍵開始', canvas.width / 2, canvas.height / 2);
        ctx.textAlign = 'left';
        
        drawAllNPCs();
        return;
    }

    if (imgBoss.complete && imgBoss.naturalWidth !== 0) {
        ctx.drawImage(imgBoss, boss.x, boss.y, boss.width, boss.height);
    } else {
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
    }

    ctx.fillStyle = '#333';
    ctx.fillRect(boss.x, boss.y - 12, boss.width, 6);
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(boss.x, boss.y - 12, (Math.max(0, boss.hp) / boss.maxHp) * boss.width, 6);

    shields.forEach(s => {
        if (imgShield.complete && imgShield.naturalWidth !== 0) {
            ctx.drawImage(imgShield, s.x, s.y, s.width, s.height);
        } else {
            ctx.fillStyle = '#1e90ff';
            ctx.fillRect(s.x, s.y, s.width, s.height);
        }
    });

    if (player.invincibleFrame % 4 < 2) {
        if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) {
            ctx.drawImage(imgPlayer, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
    }

    ctx.fillStyle = '#2ed573';
    ctx.beginPath();
    ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 3, 0, Math.PI * 2);
    ctx.fill();

    playerBullets.forEach(pb => {
        ctx.fillStyle = pb.color;
        ctx.beginPath();
        ctx.arc(pb.x, pb.y, pb.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    enemyBullets.forEach(eb => {
        if (eb.isEnhanced) {
            ctx.save();
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 10;
        }

        ctx.fillStyle = eb.isEnhanced ? '#ff4757' : eb.color;
        if (eb.type === 'rect') {
            ctx.save();
            ctx.translate(eb.x, eb.y);
            ctx.rotate(eb.angle);
            ctx.fillRect(-eb.width / 2, -eb.height / 2, eb.width, eb.height);
            ctx.restore();
        } else {
            ctx.beginPath();
            ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        if (eb.isEnhanced) ctx.restore();
    });

    puddings.forEach(p => {
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7e5109';
        ctx.beginPath();
        ctx.arc(p.x, p.y - p.radius * 0.3, p.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
    });

    burgerSteaks.forEach(b => {
        ctx.save();
        ctx.strokeStyle = '#FFFF00';
        ctx.lineWidth = 3.5;
        ctx.fillStyle = '#5c3317';

        ctx.beginPath();
        ctx.roundRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height, 8);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    });

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(`SCORE: ${score}`, playArea.left + 15, 30);

    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, playArea.left + 15, 55);

    drawAllNPCs();

    // 🏆 獲勝畫面
    if (gameWin) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (imgWin.complete && imgWin.naturalWidth !== 0) {
            const imgW = 240;
            const imgH = 200;
            const imgX = (canvas.width - imgW) / 2;
            const imgY = 120;
            ctx.drawImage(imgWin, imgX, imgY, imgW, imgH);
        }

        ctx.fillStyle = '#2ed573';
        ctx.font = 'bold 28px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('恭喜你成功打敗雪之惡魔(喜)', canvas.width / 2, 390);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px "Microsoft JhengHei", Arial';
        ctx.fillText('重新開始被雷普', canvas.width / 2, 440);
        ctx.textAlign = 'left';
    }

    // 💀 失敗畫面
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (imgGameOver.complete && imgGameOver.naturalWidth !== 0) {
            const imgW = 380;
            const imgH = 380;
            const imgX = (canvas.width - imgW) / 2;
            const imgY = 40;
            ctx.drawImage(imgGameOver, imgX, imgY, imgW, imgH);
        }

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 30px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('被無盡的厥力(悲)', canvas.width / 2, 460);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px "Microsoft JhengHei", Arial';
        ctx.fillText('重新開始被雷普', canvas.width / 2, 510);
        ctx.textAlign = 'left';
    }
}

function animate() {
    update();
    draw();
    requestAnimationFrame(animate);
}

animate();
</script>
