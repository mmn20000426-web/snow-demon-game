<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會員制的打架 -同樂赤石版</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 10px; background-color: #111; color: #fff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
        }
        h2 { margin: 5px; color: #FFD700; text-align: center; }
        
        /* 大廳與連線控制區 */
        #lobby {
            background: #1a1c23; border: 2px solid #FFD700; border-radius: 8px;
            padding: 15px; width: 100%; max-width: 500px; text-align: center; margin-bottom: 10px;
        }
        .lobby-group { margin: 10px 0; }
        input[type="text"] {
            padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #555;
            text-align: center; text-transform: uppercase; letter-spacing: 2px; width: 140px;
        }
        button.btn-main {
            background: #1e90ff; color: white; border: none; padding: 8px 16px;
            font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 4px;
        }
        button.btn-main:active { transform: scale(0.95); }
        button.btn-boss { background: #ff4757; }
        
        #status-text { color: #2ed573; font-weight: bold; margin-top: 8px; font-size: 14px; }

        /* 遊戲畫布與按鈕 */
        #game-container {
            position: relative; display: flex; flex-direction: column; align-items: center;
            width: min(100vw - 20px, 500px); border-radius: 8px; overflow: hidden;
            box-shadow: 0 0 15px rgba(255,215,0,0.3); background: #0d0f18;
        }
        canvas { background: #0d0f18; display: block; width: 100%; height: auto; }
        
        /* 手機按鈕 */
        .touch-bar {
            width: 100%; background: #1a1c23; display: flex; justify-content: space-around; padding: 8px;
        }
        .mobile-btn {
            background: #ff4757; color: white; border: none; padding: 10px 18px;
            font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>

<h2>會員制的打架 (WebRTC 連線版)</h2>

<div id="lobby">
    <div class="lobby-group">
        <label>模式選擇：</label>
        <button class="btn-main" onclick="setGameMode('pve')">🤖 PvE (單人/雙人打 AI)</button>
        <button class="btn-main btn-boss" onclick="setGameMode('pvp')">⚔️ PvP (真人 BOSS 戰)</button>
    </div>

    <div class="lobby-group">
        <button class="btn-main" onclick="createRoom()">🏠 創建房間 (成為房主)</button>
    </div>

    <div class="lobby-group">
        <input type="text" id="room-code-input" maxlength="5" placeholder="5碼邀請碼">
        <button class="btn-main" onclick="joinRoom()">🔗 加入房間</button>
    </div>

    <div id="status-text">請選擇模式或創建房間...</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="touch-bar">
        <button id="btn-action-1" class="mobile-btn" onclick="triggerRoleAbility(1)">🛡️ 護盾 / 招式1</button>
        <button id="btn-action-2" class="mobile-btn" style="background:#2ed573" onclick="triggerRoleAbility(2)">⚡ 特殊 / 招式2</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 遊戲狀態與連線變數 ---
let peer = null;
let conn = null;
let myRole = 'host'; // 'host' (房主/BOSS) 或 'guest' (加入者/英雄)
let gameMode = 'pve'; // 'pve' 或 'pvp'
let roomCode = '';
let isConnected = false;

// 遊戲實體
const player = { x: 225, y: 420, width: 40, height: 40, hp: 20, maxHp: 20, speed: 5 };
const boss = { x: 200, y: 30, width: 100, height: 60, hp: 50, maxHp: 50, speed: 4, dir: 1 };
const bullets = [];
let shieldActive = false;

// --- 生成 5 位英數邀請碼 ---
function generate5Code() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

function setGameMode(mode) {
    gameMode = mode;
    document.getElementById('status-text').innerText = `已選擇模式：${mode.toUpperCase()}`;
}

// --- 建立房間 (Host) ---
function createRoom() {
    roomCode = generate5Code();
    myRole = 'host';
    
    // PeerJS ID 加上前綴以防止重複
    peer = new Peer('MBR-' + roomCode);

    peer.on('open', (id) => {
        document.getElementById('status-text').innerText = `房間已建立！邀請碼：【 ${roomCode} 】(等待玩家加入...)`;
    });

    peer.on('connection', (c) => {
        conn = c;
        setupDataConnection();
        document.getElementById('status-text').innerText = `🎉 玩家已成功加入！連線準備就緒。`;
        isConnected = true;
    });

    peer.on('error', (err) => {
        alert('建立失敗，請重試或更換邀請碼');
    });
}

// --- 加入房間 (Guest) ---
function joinRoom() {
    const inputCode = document.getElementById('room-code-input').value.trim().toUpperCase();
    if (inputCode.length !== 5) {
        alert('請輸入正確的 5 位數邀請碼！');
        return;
    }
    
    myRole = 'guest';
    peer = new Peer(); // 隨機生成自己的 ID

    peer.on('open', () => {
        document.getElementById('status-text').innerText = `正在連線至房間 ${inputCode}...`;
        conn = peer.connect('MBR-' + inputCode);

        conn.on('open', () => {
            setupDataConnection();
            document.getElementById('status-text').innerText = `🎉 成功連線至房間！`;
            isConnected = true;
        });
    });

    peer.on('error', (err) => {
        alert('無法找到該房間，請確認邀請碼是否正確。');
    });
}

// --- 資料傳輸處理 (WebRTC) ---
function setupDataConnection() {
    conn.on('data', (data) => {
        // 收到對方位置與動作資料
        if (data.type === 'sync_position') {
            if (myRole === 'host') {
                // 房主接收 Guest (玩家) 的位置
                player.x = data.x;
                player.y = data.y;
            } else {
                // Guest 接收 Host (BOSS/玩家) 的位置與血量
                boss.x = data.bossX;
                boss.y = data.bossY;
                boss.hp = data.bossHp;
                player.hp = data.playerHp;
            }
        } else if (data.type === 'boss_attack') {
            spawnBossBullet(data.attackType);
        } else if (data.type === 'player_ability') {
            triggerShield();
        }
    });
}

// --- 同步數據給對方 ---
function sendSyncData() {
    if (!conn || !isConnected) return;

    if (myRole === 'guest') {
        conn.send({ type: 'sync_position', x: player.x, y: player.y });
    } else if (myRole === 'host') {
        conn.send({
            type: 'sync_position',
            bossX: boss.x, bossY: boss.y,
            bossHp: boss.hp, playerHp: player.hp
        });
    }
}

// --- 技能發動 ---
function triggerRoleAbility(btnIndex) {
    if (gameMode === 'pvp' && myRole === 'host') {
        // 真人 BOSS 招式
        const attackType = btnIndex === 1 ? 'fan' : 'laser';
        spawnBossBullet(attackType);
        if (conn) conn.send({ type: 'boss_attack', attackType: attackType });
    } else {
        // 英雄玩家護盾
        triggerShield();
        if (conn) conn.send({ type: 'player_ability' });
    }
}

function triggerShield() {
    shieldActive = true;
    setTimeout(() => { shieldActive = false; }, 1500);
}

function spawnBossBullet(type) {
    if (type === 'fan') {
        for (let i = -2; i <= 2; i++) {
            bullets.push({ x: boss.x + boss.width / 2, y: boss.y + boss.height, vx: i * 2, vy: 4, radius: 6 });
        }
    } else if (type === 'laser') {
        bullets.push({ x: boss.x + boss.width / 2, y: boss.y + boss.height, vx: 0, vy: 8, radius: 12 });
    }
}

// --- 移動與觸控控制 (適用於手機與電腦) ---
let isDragging = false;
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const targetX = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const targetY = (touch.clientY - rect.top) * (canvas.height / rect.height);

    if (myRole === 'host' && gameMode === 'pvp') {
        boss.x = Math.max(0, Math.min(canvas.width - boss.width, targetX - boss.width / 2));
    } else {
        player.x = Math.max(0, Math.min(canvas.width - player.width, targetX - player.width / 2));
        player.y = Math.max(200, Math.min(canvas.height - player.height, targetY - player.height / 2));
    }
}, { passive: false });

// 鍵盤移動 (電腦專用)
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// --- 遊戲邏輯更新 ---
function update() {
    // 電腦鍵盤操作
    if (myRole === 'guest' || (myRole === 'host' && gameMode === 'pve')) {
        if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
        if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
    } else if (myRole === 'host' && gameMode === 'pvp') {
        if (keys['ArrowLeft'] || keys['a']) boss.x -= boss.speed;
        if (keys['ArrowRight'] || keys['d']) boss.x += boss.speed;
    }

    // AI BOSS 移動 (單人或 PvE 時由 Host 運算)
    if (gameMode === 'pve' && myRole === 'host') {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) boss.dir *= -1;
        if (Math.random() < 0.03) spawnBossBullet('fan');
    }

    // 子彈邏輯
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;

        // 判定擊中英雄玩家
        const dx = (player.x + player.width / 2) - b.x;
        const dy = (player.y + player.height / 2) - b.y;
        if (Math.sqrt(dx * dx + dy * dy) < b.radius + 15) {
            if (!shieldActive) player.hp = Math.max(0, player.hp - 1);
            bullets.splice(i, 1);
            continue;
        }

        if (b.y > canvas.height) bullets.splice(i, 1);
    }

    sendSyncData();
}

// --- 繪製畫面 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // BOSS
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText(`BOSS HP: ${boss.hp}`, boss.x + 10, boss.y - 5);

    // 英雄玩家
    ctx.fillStyle = '#1e90ff';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = '#fff';
    ctx.fillText(`PLAYER HP: ${player.hp}`, player.x - 5, player.y - 5);

    // 護盾特效
    if (shieldActive) {
        ctx.strokeStyle = '#00d2ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(player.x - 5, player.y - 5, player.width + 10, player.height + 10);
    }

    // 彈幕
    ctx.fillStyle = '#FFD700';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
