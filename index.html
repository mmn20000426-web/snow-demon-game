<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會員制的打架 - 赤石大王</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 10px; background-color: #111; color: #fff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden;
        }
        h2 { margin: 2px 0 12px 0; color: #FFD700; text-align: center; font-size: 22px; }
        
        #menu-container {
            background: #1a1c23; border: 2px solid #FFD700; border-radius: 8px;
            padding: 20px; width: min(100vw - 20px, 500px); text-align: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .menu-title { font-size: 18px; color: #FFD700; font-weight: bold; margin-bottom: 15px; }
        .menu-btn {
            background: #1e90ff; color: white; border: none; padding: 12px 18px;
            font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer;
            margin: 6px 0; width: 100%; transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn.red { background: #ff4757; }
        .menu-btn.green { background: #2ed573; color: #111; }
        
        #net-panel {
            display: none; margin-top: 15px; padding-top: 15px;
            border-top: 1px solid #444; background: #252836; border-radius: 6px; padding: 10px;
        }
        input[type="text"] {
            padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #555;
            text-align: center; text-transform: uppercase; letter-spacing: 2px; width: 140px; margin: 4px;
        }
        #status-text { color: #2ed573; font-size: 14px; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<h2>會員制的打架</h2>

<div id="menu-container">
    <div class="menu-title">🎮 請選擇遊戲模式</div>
    
    <button class="menu-btn red" onclick="goGame('single')">🥊 單人赤石模式 (原版)</button>
    <button class="menu-btn green" onclick="showMultiplayerSetup('pve')">👥 雙人赤石 - PvE (合作打 AI)</button>
    <button class="menu-btn" onclick="showMultiplayerSetup('pvp')">⚔️ 雙人赤石 - PvP (玩家 vs Boss)</button>

    <div id="net-panel">
        <div id="pvp-role-select" style="display:none; margin-bottom: 10px;">
            <label style="font-size: 14px; font-weight: bold;">你的身份：</label>
            <select id="role-select" style="padding: 6px; border-radius: 4px; font-size: 14px;">
                <option value="boss">👹 我要當 BOSS (房主)</option>
                <option value="player">🛡️ 我要當 玩家 (加入者)</option>
            </select>
        </div>

        <div>
            <button class="menu-btn green" style="width: auto; padding: 8px 16px;" onclick="createRoom()">🏠 創建房間</button>
        </div>
        
        <div style="margin-top: 10px;">
            <input type="text" id="room-code-input" maxlength="5" placeholder="5碼邀請碼">
            <button class="menu-btn" style="width: auto; padding: 8px 16px;" onclick="joinRoom()">🔗 加入房間</button>
        </div>
        
        <div id="status-text">請點擊創建房間或輸入 5 碼邀請碼</div>
    </div>
</div>

<script>
let currentMode = 'single';

function goGame(mode, params = '') {
    window.location.href = `game.html?mode=${mode}${params}`;
}

function showMultiplayerSetup(mode) {
    currentMode = mode;
    document.getElementById('net-panel').style.display = 'block';
    document.getElementById('pvp-role-select').style.display = (mode === 'pvp') ? 'block' : 'none';
}

function generate5Code() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let res = '';
    for (let i = 0; i < 5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
    return res;
}

function createRoom() {
    const roomCode = generate5Code();
    const role = document.getElementById('role-select').value;
    goGame(currentMode, `&role=host&room=${roomCode}&pvpRole=${role}`);
}

function joinRoom() {
    const inputCode = document.getElementById('room-code-input').value.trim().toUpperCase();
    if (inputCode.length !== 5) return alert('請輸入 5 位數邀請碼！');
    goGame(currentMode, `&role=guest&room=${inputCode}`);
}
</script>

</body>
</html>
