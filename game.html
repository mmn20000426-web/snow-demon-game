<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會員制的打架 - 三階段 BOSS 戰 (WebRTC 連線版)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 5px; background-color: #111; color: #fff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden;
        }
        h2 { margin: 2px 0 8px 0; color: #FFD700; text-align: center; font-size: 20px; }
        
        /* WebRTC 聯機大廳面板 */
        #webrtc-lobby {
            background: #1a1c23; border: 2px solid #2ed573; border-radius: 6px;
            padding: 8px 12px; margin-bottom: 8px; width: min(100vw - 20px, 600px);
            text-align: center; font-size: 13px;
        }
        #webrtc-lobby input { padding: 4px 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
        #webrtc-lobby button { padding: 4px 10px; background: #2ed573; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 4px; }

        #main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 1000px; }
        #game-container {
            position: relative; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; width: min(100vw - 20px, 600px); flex-shrink: 0; z-index: 1;
        }
        canvas { background: #0d0f18; display: block; cursor: crosshair; width: 100%; height: auto; }

        .mobile-touch-bar {
            width: 100%; background: #1a1c23; display: flex; justify-content: space-around;
            padding: 6px; border-top: 2px solid #333a4e;
        }

        /* PvP BOSS 專用技能欄位 */
        #pvp-boss-bar {
            display: none; width: 100%; background: #3a1111; padding: 6px;
            border-top: 2px solid #ff4757; justify-content: space-around; flex-wrap: wrap; gap: 4px;
        }
        #pvp-boss-bar.active { display: flex !important; }

        #qte-mobile-bar {
            display: none; width: 100%; background: #2b1111; padding: 8px;
            border-top: 2px solid #ff4757; justify-content: center; gap: 6px; flex-wrap: wrap;
        }
        #qte-mobile-bar.active { display: flex !important; }
        .qte-btn {
            background: #ff4757; color: white; border: 2px solid #fff; padding: 10px 16px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 #b32b37;
        }
        .qte-btn:active { transform: translateY(4px); box-shadow: none; }

        .mobile-btn {
            background: #1e90ff; color: white; border: none; padding: 8px 14px;
            font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s;
            user-select: none; touch-action: manipulation;
        }
        .mobile-btn:active { transform: scale(0.95); }
        .mobile-btn.control-btn { background: #ff4757; }
        .mobile-btn.boss-skill-btn { background: #8e44ad; }
        .mobile-btn:disabled { background: #555 !important; color: #aaa; cursor: not-allowed; box-shadow: none; }

        #sidebar-container { display: flex; flex-direction: column; gap: 8px; width: min(100vw - 20px, 600px); }
        #achievement-section {
            background: #1a1c23; border: 2px solid #FFD700; border-radius: 6px;
            padding: 8px 10px; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        #achievement-section h3 { margin: 0 0 6px 0; color: #FFD700; text-align: center; font-size: 14px; }
        .achievement-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .achievement-card {
            background: #252836; border: 1px solid #444; border-radius: 4px;
            padding: 4px; text-align: center; font-size: 11px; color: #888; transition: all 0.3s ease;
        }
        .achievement-card.unlocked {
            background: #1e3799; border-color: #60a5fa; color: #fff; font-weight: bold;
            box-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
        }
        #control-panel-overlay { display: none; pointer-events: none; }
        #control-panel-overlay.active { display: flex !important; pointer-events: auto !important; }
        #control-panel {
            background: rgba(30, 34, 48, 0.98); border: 2px solid #ff4757;
            border-radius: 6px; padding: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            max-height: 480px; overflow-y: auto;
        }
        #control-panel h3 { margin-top: 0; margin-bottom: 8px; color: #FFD700; border-bottom: 1px solid #333a4e; padding-bottom: 4px; text-align: center; font-size: 14px; }
        .close-panel-btn { width: 100%; background: #ff4757; color: white; border: none; padding: 6px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .panel-section { margin-bottom: 8px; }
        .panel-section h4 { margin: 4px 0; color: #2ed573; font-size: 12px; }
        .toggle-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 11px; }
        .toggle-item label { cursor: pointer; }
        .toggle-item input[type="checkbox"] { cursor: pointer; width: 15px; height: 15px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .panel-btn { background: #3498db; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: background 0.2s; }
        .panel-btn:hover { background: #2980b9; }
        .panel-btn.success { background: #2ed573; color: #111; }
        .panel-btn.danger { background: #e74c3c; }

        @media (min-width: 850px) {
            #main-wrapper { flex-direction: row; align-items: flex-start; justify-content: center; }
            #sidebar-container { width: 320px; }
            .close-panel-btn { display: none; }
            #control-panel-overlay { display: block !important; pointer-events: auto !important; position: static !important; width: auto !important; height: auto !important; background: none !important; }
        }
        @media (max-width: 849px) {
            #control-panel-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; }
            #control-panel { width: 90%; max-width: 320px; max-height: 80vh; }
            .close-panel-btn { display: block; }
        }
        .instructions { margin-top: 4px; text-align: center; color: #aaa; font-size: 11px; }
    </style>
</head>
<body>

<h2 id="game-title">會員制的打架</h2>

<div id="webrtc-lobby">
    <span>我的 Peer ID: <strong id="my-peer-id" style="color:#2ed573;">生成中...</strong></span>
    <span style="margin: 0 8px;">|</span>
    <input type="text" id="target-peer-id" placeholder="輸入房主 ID">
    <button onclick="connectToPeer()">加入房間</button>
    <div id="rtc-status" style="font-size: 11px; color: #aaa; margin-top: 2px;">未連線 (可直接進行單人遊戲)</div>
</div>

<div id="main-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="normal-touch-bar" class="mobile-touch-bar">
            <button id="btn-shield-ui" class="mobile-btn" onclick="trySummonShield()">🛡️ 護盾 [U]</button>
            <button id="btn-console-ui" class="mobile-btn control-btn" onclick="toggleControlPanel()">🎛️ 控制台 [I]</button>
        </div>

        <div id="pvp-boss-bar">
            <button class="mobile-btn boss-skill-btn" onclick="triggerLaser()">🍷 黃色雷射 [1]</button>
            <button class="mobile-btn boss-skill-btn" onclick="triggerNoodles()">🍜 召喚麵條 [2]</button>
            <button class="mobile-btn boss-skill-btn" onclick="triggerBurger()">🥩 拋擲漢堡肉 [3]</button>
            <button class="mobile-btn boss-skill-btn" onclick="triggerBossFanShot()">💥 扇形彈幕 [Space]</button>
        </div>

        <div id="qte-mobile-bar">
            <button class="qte-btn" onclick="handleQTEInput('W')">W</button>
            <button class="qte-btn" onclick="handleQTEInput('A')">A</button>
            <button class="qte-btn" onclick="handleQTEInput('S')">S</button>
            <button class="qte-btn" onclick="handleQTEInput('D')">D</button>
            <button class="qte-btn" onclick="handleQTEInput('J')">J</button>
            <button class="qte-btn" onclick="handleQTEInput('K')">K</button>
            <button class="qte-btn" onclick="handleQTEInput('L')">L</button>
            <button class="qte-btn" onclick="handleQTEInput('U')">U</button>
        </div>
    </div>

    <div id="sidebar-container">
        <div id="achievement-section">
            <h3>🏆 遊戲成就解鎖</h3>
            <div class="achievement-grid">
                <div id="ach-1" class="achievement-card">🔒 沒交到壞朋友(喜)<br><small>(無開控制台)</small></div>
                <div id="ach-2" class="achievement-card">🔒 被無限餵石力(悲)<br><small>(無開控制台)</small></div>
                <div id="ach-3" class="achievement-card">🔒 低調的黑客</div>
                <div id="ach-4" class="achievement-card">🔒 怕不是桂口巴<br><small>(無開控制台)</small></div>
                <div id="ach-5" class="achievement-card" style="grid-column: span 2;">🔒 一轉攻勢<br><small>(剩 1 HP 擊敗 Boss)</small></div>
            </div>
        </div>

        <div id="control-panel-overlay">
            <div id="control-panel">
                <button class="close-panel-btn" onclick="toggleControlPanel()">❌ 關閉控制台</button>
                <h3 id="panel-title-status">🎛️ 控制台</h3>

                <div class="panel-section">
                    <h4>⚡ 即時狀態控制</h4>
                    <div class="toggle-item">
                        <label for="sw-pause-boss" style="color:#ff6b6b; font-weight:bold;">⏸️ 暫停 Boss 移動/攻擊</label>
                        <input type="checkbox" id="sw-pause-boss" onchange="markConsoleUsed()">
                    </div>
                    <button class="panel-btn success" style="width: 100%; margin-top: 4px;" onclick="healPlayerToFull()">💚 補滿玩家血量</button>
                </div>

                <div class="panel-section">
                    <h4>自動釋放開關</h4>
                    <div class="toggle-item"><label for="sw-orange">橘色扇形彈幕</label><input type="checkbox" id="sw-orange" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-green">綠色長條彈幕</label><input type="checkbox" id="sw-green" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-brown">咖啡圓形彈幕</label><input type="checkbox" id="sw-brown" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-pudding">追蹤布丁（封印區）</label><input type="checkbox" id="sw-pudding" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-laser">黃色雷射</label><input type="checkbox" id="sw-laser" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-burger">漢堡肉</label><input type="checkbox" id="sw-burger" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-noodle">麵條牆</label><input type="checkbox" id="sw-noodle" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-medkit">急救包 Medkit</label><input type="checkbox" id="sw-medkit" checked onchange="markConsoleUsed()"></div>
                </div>

                <div class="panel-section">
                    <h4>手動即時觸發</h4>
                    <div class="btn-grid">
                        <button class="panel-btn" onclick="triggerLaser()">發射雷射</button>
                        <button class="panel-btn" onclick="triggerNoodles()">召喚麵條</button>
                        <button class="panel-btn" onclick="triggerBurger()">丟漢堡肉</button>
                        <button class="panel-btn" onclick="triggerMedkit()">掉落Medkit</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h4>除錯功能</h4>
                    <button class="panel-btn danger" style="width: 100%;" onclick="clearEnemyBullets()">清空敵方子彈</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="instructions">
    <p id="instruction-text">🎮 拖曳畫面移動 | [U] 護盾 | [I] 開關控制台 | [P] 隱藏秒殺技能</p>
</div>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<audio id="loseBgm" src="lose.mp3" preload="auto"></audio>
<audio id="winBgm" src="win.mp3" preload="auto"></audio>
<audio id="win2Bgm" src="win2.mp3" preload="auto"></audio>
<audio id="win3Bgm" src="win3.mp3" preload="auto"></audio>
<audio id="win4Bgm" src="win4.mp3" preload="auto"></audio>

<script>
// --- 模式與網址參數分析 ---
const urlParams = new URLSearchParams(window.location.search);
let gameMode = urlParams.get('mode') || 'single'; // 'single', 'pve', 'pvp'
let pvpRole = urlParams.get('pvpRole') || 'player'; // 'boss', 'player'
let isMultiplayer = gameMode === 'pve' || gameMode === 'pvp';

// WebRTC 全域變數
let peer = null;
let conn = null;
let isHost = true; // 預設創建者為 Host

function initWebRTC() {
    peer = new Peer();
    peer.on('open', (id) => {
        document.getElementById('my-peer-id').innerText = id;
    });
    peer.on('connection', (connection) => {
        conn = connection;
        isHost = true;
        isMultiplayer = true;
        player2.isAlive = true;
        setupRTCListeners();
        document.getElementById('rtc-status').innerText = '🟢 已連線！玩家 2 已進入遊戲';
    });
}

function connectToPeer() {
    const targetId = document.getElementById('target-peer-id').value.trim();
    if (!targetId) return alert('請輸入房主的 Peer ID');
    conn = peer.connect(targetId);
    isHost = false;
    isMultiplayer = true;
    player2.isAlive = true;
    setupRTCListeners();
    document.getElementById('rtc-status').innerText = '🟡 連線中...';
}

function setupRTCListeners() {
    conn.on('open', () => {
        document.getElementById('rtc-status').innerText = '🟢 連線成功！即時同步中';
    });
    conn.on('data', (data) => {
        if (isHost) {
            if (data.type === 'INPUT') {
                player2.x = data.x;
                player2.y = data.y;
                if (data.shield) trySummonShield();
            }
            if (data.type === 'BOSS_ACTION') {
                handleBossSkill(data.action);
            }
        } else {
            if (data.type === 'SYNC') {
                boss.x = data.boss.x; boss.y = data.boss.y; boss.hp = data.boss.hp; boss.maxHp = data.boss.maxHp;
                player.x = data.player.x; player.y = data.player.y; player.hp = data.player.hp;
                player2.hp = data.player2.hp;
                bossPhase = data.bossPhase;
                gameOver = data.gameOver; gameWin = data.gameWin;
            }
            if (data.type === 'BOSS_ACTION') {
                handleBossSkill(data.action);
            }
        }
    });
}

// BOSS 技能處理與網路廣播
function handleBossSkill(action) {
    if (action === 'LASER') triggerLaserLogic();
    if (action === 'NOODLE') triggerNoodlesLogic();
    if (action === 'BURGER') triggerBurgerLogic();
    if (action === 'FAN_SHOT') triggerBossFanShotLogic();
}

function sendBossSkill(action) {
    handleBossSkill(action);
    if (conn && conn.open) {
        conn.send({ type: 'BOSS_ACTION', action: action });
    }
}

function triggerLaser() { sendBossSkill('LASER'); }
function triggerNoodles() { sendBossSkill('NOODLE'); }
function triggerBurger() { sendBossSkill('BURGER'); }
function triggerBossFanShot() { sendBossSkill('FAN_SHOT'); }

function triggerLaserLogic() {
    if (!isMultiplayer) markConsoleUsed();
    isLaserActive = true;
    laserDuration = 45;
}

function triggerNoodlesLogic() {
    if (!isMultiplayer) markConsoleUsed();
    for (let i = 0; i < 4; i++) {
        noodles.push({
            x: Math.random() * (playArea.width - 60) + playArea.left + 30,
            y: Math.random() * (canvas.height - 300) + 180,
            width: 18, height: 75, angle: Math.random() * Math.PI, duration: 240
        });
    }
}

function triggerBurgerLogic() {
    if (!isMultiplayer) markConsoleUsed();
    const startX = boss.x + boss.width / 2;
    const startY = boss.y + boss.height;
    const targetX = Math.random() * (playArea.width - 80) + playArea.left + 40;
    const targetY = Math.random() * (canvas.height - 250) + 150;
    const angle = Math.atan2(targetY - startY, targetX - startX);

    burgerSteaks.push({
        x: startX, y: startY, targetX: targetX, targetY: targetY,
        vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
        width: 38, height: 26, isStationary: false, stayDuration: 180
    });
}

function triggerBossFanShotLogic() {
    const count = 5;
    const startAngle = Math.PI * 0.3;
    const endAngle = Math.PI * 0.7;
    const step = (endAngle - startAngle) / (count - 1);

    for (let i = 0; i < count; i++) {
        const angle = startAngle + step * i;
        enemyBullets.push({
            x: boss.x + boss.width / 2, y: boss.y + boss.height,
            vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5,
            width: 35, height: 10, angle: angle, color: '#FF4757', type: 'rect', damage: 1
        });
    }
}

// 介面適應與控制台封鎖
if (isMultiplayer) {
    document.getElementById('achievement-section').style.display = 'none';
    document.getElementById('control-panel-overlay').style.display = 'none';
    document.getElementById('btn-console-ui').style.display = 'none';
    
    if (gameMode === 'pvp' && pvpRole === 'boss') {
        document.getElementById('pvp-boss-bar').classList.add('active');
        document.getElementById('normal-touch-bar').style.display = 'none';
        document.getElementById('instruction-text').innerText = "🎮 按 [A]/[D] 左右移動 | [1] 雷射 | [2] 麵條 | [3] 漢堡肉 | [Space] 扇形彈幕";
        document.getElementById('game-title').innerText = "會員制的打架 - PvP 模式 (你飾演 BOSS)";
    } else {
        document.getElementById('instruction-text').innerText = "🎮 拖曳畫面移動 | [U] 護盾";
        document.getElementById('game-title').innerText = `會員制的打架 - ${gameMode.toUpperCase()} 雙人模式`;
    }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const bgm = document.getElementById('bgm');
const loseBgm = document.getElementById('loseBgm');
const winBgm = document.getElementById('winBgm');
const win2Bgm = document.getElementById('win2Bgm');
const win3Bgm = document.getElementById('win3Bgm');
const win4Bgm = document.getElementById('win4Bgm');

const playArea = { left: 90, right: 510, width: 420 };

const imgPlayer = new Image(); imgPlayer.src = 'player.jpg';
const imgPlayer2 = new Image(); imgPlayer2.src = 'player2.jpg';
const imgBoss1 = new Image(); imgBoss1.src = 'boss.jpg';
const imgBoss2 = new Image(); imgBoss2.src = 'boss2.jpg';
const imgBoss3 = new Image(); imgBoss3.src = 'boss3.jpg';
const imgGameOver = new Image(); imgGameOver.src = 'boss.jpg';  
const imgWin = new Image(); imgWin.src = 'win.jpg';
const imgWin2 = new Image(); imgWin2.src = 'win2.jpg';
const imgWin3 = new Image(); imgWin3.src = 'win3.jpg';
const imgWin4 = new Image(); imgWin4.src = 'win4.jpg';
const imgShield = new Image(); imgShield.src = 'shield.jpg';
const imgMedkit = new Image(); imgMedkit.src = 'medkit.jpg';

const npcImages = {
    npc1: new Image(), npc2: new Image(), npc3: new Image(),
    bnpc1: new Image(), bnpc2: new Image(), bnpc3: new Image()
};
npcImages.npc1.src = 'npc1.jpg';
npcImages.npc2.src = 'npc2.jpg';
npcImages.npc3.src = 'npc3.jpg';
npcImages.bnpc1.src = 'bnpc1.jpg';
npcImages.bnpc2.src = 'bnpc2.jpg';
npcImages.bnpc3.src = 'bnpc3.jpg';

let gameStarted = false;
let score = 0;
let gameOver = false;
let gameWin = false;
let isPausedForPanel = false;
let frameCount = 0;

let hasUsedConsole = false;
let tookDamage = false;
const unlockedAchievements = { ach1: false, ach2: false, ach3: false, ach4: false, ach5: false };

const keys = {};

let npc3SpecialTextTimer = null;
let isNpc3SpecialText = false;

let shieldCooldown = 0;
const SHIELD_CD_MAX = 120; 
const bossWallY = 150;

// 階段與 QTE 狀態
let bossPhase = 1;
let qteActive = false;
let qteTimer = 0; 
let qteSequence = [];
let qteIndex = 0;
let qteLaserActive = false;
let qteLaserTimer = 0;
let qteNpc3Shield = null;
let bnpcDefeated = false;
let npc3Defeated = false; 
let qteSuccessMsgTimer = 0;
let is1HpWinMode = false;

// 玩家 1 屬性
const player = {
    x: playArea.left + playArea.width / 3 - 22,
    y: canvas.height - 80,
    width: 44, height: 44,
    baseSpeed: 6, speed: 6, radius: 9,
    hp: 25, maxHp: 25,
    invincibleFrame: 0,
    isAlive: true
};

// 玩家 2 屬性 (雙人模式下開啟)
const player2 = {
    x: playArea.left + (playArea.width / 3) * 2 - 22,
    y: canvas.height - 80,
    width: 44, height: 44,
    baseSpeed: 6, speed: 6, radius: 9,
    hp: 25, maxHp: 25,
    invincibleFrame: 0,
    isAlive: isMultiplayer
};

// Boss 基礎資料 (PvE血量2倍)
const bossHpMult = (gameMode === 'pve') ? 2 : 1;
const boss = {
    x: playArea.left + playArea.width / 2 - 60,
    y: 35,
    width: 120, height: 70,
    dir: 1, speed: 2.5,
    hp: 50 * bossHpMult,
    maxHp: 50 * bossHpMult
};

function updateBossDimensions(img) {
    if (img && img.complete && img.naturalWidth !== 0) {
        const maxWidth = 160;
        const scale = maxWidth / img.naturalWidth;
        boss.width = img.naturalWidth * scale;
        boss.height = img.naturalHeight * scale;
    }
}

imgBoss1.onload = () => updateBossDimensions(imgBoss1);
imgBoss2.onload = () => { if (bossPhase === 2) updateBossDimensions(imgBoss2); };
imgBoss3.onload = () => { if (bossPhase === 3) updateBossDimensions(imgBoss3); };

const shields = [];
const enemyBullets = [];  
const playerBullets = []; 
const puddings = [];       
const sealZones = [];      
const burgerSteaks = [];   
const noodles = [];        
const medkits = [];        

let laserTimer = 0;
let isLaserActive = false;
let laserDuration = 0;

let isResettingSwitches = false;

function markConsoleUsed() {
    if (!isResettingSwitches) hasUsedConsole = true;
}

function toggleControlPanel() {
    if (isMultiplayer) return;
    const overlay = document.getElementById('control-panel-overlay');
    const isMobile = window.innerWidth < 850;

    if (isMobile) {
        const isActive = overlay.classList.contains('active');
        if (isActive) {
            overlay.classList.remove('active');
            isPausedForPanel = false;
        } else {
            overlay.classList.add('active');
            isPausedForPanel = true;
        }
    } else {
        isPausedForPanel = !isPausedForPanel;
    }

    const panelTitle = document.getElementById('panel-title-status');
    if (panelTitle) {
        panelTitle.innerText = isPausedForPanel ? "🎛️ 控制台 (遊戲暫停中)" : "🎛️ 控制台";
    }
}

function unlockAchievement(id, key, text) {
    if (isMultiplayer) return;
    if (!unlockedAchievements[key]) {
        unlockedAchievements[key] = true;
        const el = document.getElementById(id);
        if (el) {
            el.classList.add('unlocked');
            el.innerHTML = `🏆 ${text}`;
        }
    }
}

function healPlayerToFull() {
    markConsoleUsed();
    if (player.isAlive) player.hp = player.maxHp;
    if (isMultiplayer && player2.isAlive) player2.hp = player2.maxHp;
}

function clearEnemyBullets() {
    markConsoleUsed();
    enemyBullets.length = 0;
}

function resetControlPanelSwitches() {
    isResettingSwitches = true;
    const swPause = document.getElementById('sw-pause-boss');
    if (swPause) swPause.checked = false;
    isResettingSwitches = false;
}

function getPhaseMultipliers() {
    let speedMult = (gameMode === 'pve') ? 1.5 : 1.0;
    if (bossPhase === 1) return { freq: (1 / 0.75) / speedMult, cd: 1.0 / speedMult };
    if (bossPhase === 2) return { freq: (1 / 1.3) / speedMult, cd: 0.75 / speedMult };
    if (bossPhase === 3) return { freq: (1 / 0.65) / speedMult, cd: 1.5 / speedMult };
    return { freq: 1.0, cd: 1.0 };
}

function spawnEnemyBullets() {
    if (qteActive) return;
    const swPause = document.getElementById('sw-pause-boss');
    if (swPause && swPause.checked) return;

    const mult = getPhaseMultipliers();

    const swOrange = document.getElementById('sw-orange') ? document.getElementById('sw-orange').checked : true;
    const swGreen = document.getElementById('sw-green') ? document.getElementById('sw-green').checked : true;
    const swBrown = document.getElementById('sw-brown') ? document.getElementById('sw-brown').checked : true;
    const swPudding = document.getElementById('sw-pudding') ? document.getElementById('sw-pudding').checked : true;
    const swLaser = document.getElementById('sw-laser') ? document.getElementById('sw-laser').checked : true;
    const swBurger = document.getElementById('sw-burger') ? document.getElementById('sw-burger').checked : true;
    const swNoodle = document.getElementById('sw-noodle') ? document.getElementById('sw-noodle').checked : true;
    const swMedkit = document.getElementById('sw-medkit') ? document.getElementById('sw-medkit').checked : true;

    if (swOrange && frameCount % Math.max(1, Math.round(25 * mult.freq)) === 0) {
        const count = 3;
        const startAngle = Math.PI * 0.35;
        const endAngle = Math.PI * 0.65;
        const step = count > 1 ? (endAngle - startAngle) / (count - 1) : 0;

        for (let i = 0; i < count; i++) {
            const angle = startAngle + step * i;
            enemyBullets.push({
                x: boss.x + boss.width / 2, y: boss.y + boss.height,
                vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4,
                width: 35, height: 10, angle: angle, color: '#FF7F50', type: 'rect', damage: 1
            });
        }
    }

    if (swGreen && frameCount % Math.max(1, Math.round(28 * mult.freq)) === 0) {
        enemyBullets.push({
            x: Math.random() * (playArea.width - 30) + playArea.left + 15,
            y: 0, vx: 0, vy: 7, width: 12, height: 45, angle: 0, color: '#2ed573', type: 'rect', damage: 1
        });
    }

    if (swBrown && frameCount % Math.max(1, Math.round(20 * mult.freq)) === 0) {
        enemyBullets.push({
            x: boss.x + boss.width / 2, y: boss.y + boss.height,
            vx: (Math.random() - 0.5) * 3, vy: 5, radius: 6, color: '#8B4513', type: 'circle', damage: 1
        });
    }

    if (swPudding && frameCount % Math.max(1, Math.round(180 * mult.freq)) === 0) {
        const targetPlayer = (player.isAlive) ? player : player2;
        const targetX = targetPlayer.x + targetPlayer.width / 2;
        const targetY = targetPlayer.y + targetPlayer.height / 2;
        const startX = boss.x + boss.width / 2;
        const startY = boss.y + boss.height;
        const angle = Math.atan2(targetY - startY, targetX - startX);

        puddings.push({
            x: startX, y: startY, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, radius: 16
        });
    }

    if (swLaser && gameMode !== 'pvp') {
        laserTimer++;
        if (laserTimer >= Math.round(540 * mult.cd)) {
            triggerLaser();
            laserTimer = 0;
        }
    }

    if (swBurger && gameMode !== 'pvp' && frameCount % Math.max(1, Math.round(360 * mult.cd)) === 0) {
        triggerBurger();
    }

    if (swNoodle && gameMode !== 'pvp' && frameCount % Math.max(1, Math.round(360 * mult.cd)) === 0) {
        triggerNoodles();
    }

    if (swMedkit && frameCount % 240 === 0) {
        triggerMedkit();
    }
}

function startQTE() {
    qteActive = true;
    qteTimer = 240; 
    qteIndex = 0;
    qteLaserActive = false;
    qteNpc3Shield = null;
    enemyBullets.length = 0;

    document.getElementById('qte-mobile-bar').classList.add('active');
    document.getElementById('normal-touch-bar').style.display = 'none';

    const availableKeys = ['W', 'A', 'S', 'D', 'J', 'K', 'L', 'U'];
    qteSequence = [];
    for (let i = 0; i < 4; i++) {
        const randIndex = Math.floor(Math.random() * availableKeys.length);
        qteSequence.push(availableKeys[randIndex]);
    }
}

function handleQTEInput(pressedKey) {
    if (!qteActive) return;

    const expected = qteSequence[qteIndex];
    if (pressedKey.toUpperCase() === expected) {
        qteIndex++;
        if (qteIndex >= qteSequence.length) {
            qteActive = false;
            document.getElementById('qte-mobile-bar').classList.remove('active');
            if (gameMode !== 'pvp' || pvpRole !== 'boss') {
                document.getElementById('normal-touch-bar').style.display = 'flex';
            }
            triggerQTESuccess();
        }
    }
}

function triggerQTESuccess() {
    qteNpc3Shield = {
        x: playArea.left + 5,
        y: (player.isAlive ? player.y : player2.y) - 40,
        width: playArea.width - 10,
        height: 20
    };

    qteLaserActive = true;
    qteLaserTimer = 90; 
    qteSuccessMsgTimer = 120;

    setTimeout(() => {
        bnpcDefeated = true;
        npc3Defeated = true;
        bossPhase = 3;
        updateBossDimensions(imgBoss3);
        boss.hp = 30 * bossHpMult;
        boss.maxHp = 30 * bossHpMult;
        qteLaserActive = false;
        qteNpc3Shield = null;
    }, 1500);
}

function triggerQTEFail() {
    qteActive = false;
    document.getElementById('qte-mobile-bar').classList.remove('active');
    if (gameMode !== 'pvp' || pvpRole !== 'boss') {
        document.getElementById('normal-touch-bar').style.display = 'flex';
    }
    triggerGameOver();
}

function firePlayerBullet() {
    if (qteActive) return;
    if (player.isAlive) {
        playerBullets.push({ x: player.x + player.width / 2, y: player.y, vy: -10, radius: 5, color: '#FFD700' });
    }
    if (isMultiplayer && player2.isAlive) {
        playerBullets.push({ x: player2.x + player2.width / 2, y: player2.y, vy: -10, radius: 5, color: '#00FFCC' });
    }
}

function trySummonShield() {
    if (bossPhase === 3) return;
    if (shieldCooldown > 0 || isPausedForPanel || qteActive) return;

    if (player.isAlive) {
        shields.push({ x: player.x + player.width / 2 - 25, y: player.y - 50, width: 50, height: 45 });
    }
    if (isMultiplayer && player2.isAlive) {
        shields.push({ x: player2.x + player2.width / 2 - 25, y: player2.y - 50, width: 50, height: 45 });
    }

    shieldCooldown = SHIELD_CD_MAX;
    isNpc3SpecialText = true;
    if (npc3SpecialTextTimer) clearTimeout(npc3SpecialTextTimer);
    npc3SpecialTextTimer = setTimeout(() => { isNpc3SpecialText = false; }, 1500);
}

function playBGM() {
    if (gameStarted && !gameOver && !gameWin) {
        bgm.play().catch(() => {});
    }
}

function triggerGameOver() {
    gameOver = true;
    if (!hasUsedConsole) {
        unlockAchievement('ach-2', 'ach2', '被無限餵石力(悲)');
    }
    bgm.pause(); bgm.currentTime = 0;
    loseBgm.currentTime = 0; loseBgm.play().catch(() => {});
}

function triggerWin() {
    boss.hp = 0;
    gameWin = true;
    bgm.pause(); bgm.currentTime = 0;

    if (player.hp === 1) {
        is1HpWinMode = true;
        unlockAchievement('ach-5', 'ach5', '一轉攻勢');
        win4Bgm.currentTime = 0; win4Bgm.play().catch(() => {});
    } else if (hasUsedConsole) {
        unlockAchievement('ach-3', 'ach3', '低調的黑客');
        win2Bgm.currentTime = 0; win2Bgm.play().catch(() => {});
    } else if (!tookDamage) {
        unlockAchievement('ach-1', 'ach1', '沒交到壞朋友(喜)');
        unlockAchievement('ach-4', 'ach4', '怕不是桂口巴');
        win3Bgm.currentTime = 0; win3Bgm.play().catch(() => {});
    } else {
        unlockAchievement('ach-1', 'ach1', '沒交到壞朋友(喜)');
        winBgm.currentTime = 0; winBgm.play().catch(() => {});
    }
}

function startGame() {
    if (!gameStarted) {
        gameStarted = true;
        playBGM();
    }
}

window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === ' ') e.preventDefault();
    startGame();
    keys[e.key] = true;
    keys[e.code] = true;

    if (qteActive) {
        handleQTEInput(e.key);
        return;
    }

    // PvP Boss 按鍵觸發 (支援移動與技能)
    if (gameMode === 'pvp' && pvpRole === 'boss') {
        if (e.key === '1') triggerLaser();
        if (e.key === '2') triggerNoodles();
        if (e.key === '3') triggerBurger();
        if (e.code === 'Space') triggerBossFanShot();
        return;
    }

    if (e.key === 'u' || e.key === 'U' || e.code === 'KeyU') {
        if (!gameOver && !gameWin) trySummonShield();
    }
    if (e.key === 'i' || e.key === 'I' || e.code === 'KeyI') toggleControlPanel();
    if (e.key === 'p' || e.key === 'P' || e.code === 'KeyP') {
        if (!gameOver && !gameWin && !isMultiplayer) triggerWin();
    }
    if ((gameOver || gameWin) && (e.code === 'Space' || e.code === 'Enter')) resetGame();
});

window.addEventListener('keyup', e => {
    keys[e.key] = false;
    keys[e.code] = false;
});

let isDragging = false;
canvas.addEventListener('mousedown', e => {
    startGame();
    if (gameOver || gameWin) { resetGame(); return; }
    if (isPausedForPanel) return;
    isDragging = true;
    updatePlayerPos(e);
});

canvas.addEventListener('mousemove', e => {
    if (isDragging && !gameOver && !gameWin && !isPausedForPanel) updatePlayerPos(e);
});

window.addEventListener('mouseup', () => isDragging = false);

canvas.addEventListener('touchstart', e => {
    startGame();
    if (gameOver || gameWin) { resetGame(); return; }
    if (isPausedForPanel) return;
    isDragging = true;
    updatePlayerPos(e.touches[0]);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    if (isDragging && !gameOver && !gameWin && !isPausedForPanel) {
        updatePlayerPos(e.touches[0]);
        e.preventDefault();
    }
}, { passive: false });

window.addEventListener('touchend', () => isDragging = false);

function updatePlayerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const touchX = (evt.clientX - rect.left) * scaleX;
    const touchY = (evt.clientY - rect.top) * scaleY;

    if (gameMode === 'pvp' && pvpRole === 'boss') {
        boss.x = touchX - boss.width / 2;
        if (boss.x < playArea.left) boss.x = playArea.left;
        if (boss.x + boss.width > playArea.right) boss.x = playArea.right - boss.width;
    } else if (player.isAlive) {
        player.x = touchX - player.width / 2;
        player.y = touchY - player.height / 2;
    }
}

function resetGame() {
    score = 0; gameOver = false; gameWin = false;
    isPausedForPanel = false; frameCount = 0; shieldCooldown = 0;
    hasUsedConsole = false; tookDamage = false; is1HpWinMode = false;
    bossPhase = 1; updateBossDimensions(imgBoss1);
    qteActive = false; qteLaserActive = false; bnpcDefeated = false; npc3Defeated = false;
    qteSuccessMsgTimer = 0;

    document.getElementById('qte-mobile-bar').classList.remove('active');
    if (gameMode !== 'pvp' || pvpRole !== 'boss') {
        document.getElementById('normal-touch-bar').style.display = 'flex';
    }

    resetControlPanelSwitches();
    const overlay = document.getElementById('control-panel-overlay');
    if (overlay) overlay.classList.remove('active');

    enemyBullets.length = 0; playerBullets.length = 0; shields.length = 0;
    puddings.length = 0; sealZones.length = 0; burgerSteaks.length = 0;
    noodles.length = 0; medkits.length = 0;
    laserTimer = 0; isLaserActive = false; laserDuration = 0;

    player.x = playArea.left + playArea.width / 3 - 22; player.y = canvas.height - 80;
    player.maxHp = 25; player.hp = player.maxHp; player.invincibleFrame = 0;
    player.speed = player.baseSpeed; player.isAlive = true;

    if (isMultiplayer) {
        player2.x = playArea.left + (playArea.width / 3) * 2 - 22;
        player2.y = canvas.height - 80;
        player2.maxHp = 25; player2.hp = player2.maxHp;
        player2.invincibleFrame = 0; player2.speed = player2.baseSpeed;
        player2.isAlive = true;
    }

    boss.hp = 50 * bossHpMult; boss.maxHp = 50 * bossHpMult;
    boss.x = playArea.left + playArea.width / 2 - boss.width / 2; boss.y = 35;

    bgm.currentTime = 0; loseBgm.pause(); winBgm.pause(); win2Bgm.pause(); win3Bgm.pause(); win4Bgm.pause();
    playBGM();
}

// 主邏輯更新 Loop
function update() {
    if (gameOver || gameWin || isPausedForPanel) return;

    frameCount++;

    // PvP Boss 操控邏輯
    if (gameMode === 'pvp' && pvpRole === 'boss') {
        if (keys['a'] || keys['A'] || keys['ArrowLeft']) boss.x -= boss.speed * 1.8;
        if (keys['d'] || keys['D'] || keys['ArrowRight']) boss.x += boss.speed * 1.8;
        if (boss.x < playArea.left) boss.x = playArea.left;
        if (boss.x + boss.width > playArea.right) boss.x = playArea.right - boss.width;
    } else {
        const swPause = document.getElementById('sw-pause-boss');
        if (!swPause || !swPause.checked) {
            boss.x += boss.speed * boss.dir;
            if (boss.x <= playArea.left || boss.x + boss.width >= playArea.right) {
                boss.dir *= -1;
            }
        }
    }

    if (shieldCooldown > 0) shieldCooldown--;

    if (frameCount % 6 === 0) firePlayerBullet();

    spawnEnemyBullets();

    // 階段轉換
    if (bossPhase === 1 && boss.hp <= 0) {
        bossPhase = 2;
        updateBossDimensions(imgBoss2);
        boss.hp = 40 * bossHpMult; boss.maxHp = 40 * bossHpMult;
        enemyBullets.length = 0;
    } else if (bossPhase === 2 && boss.hp <= 0 && !qteActive && !bnpcDefeated) {
        startQTE();
    } else if (bossPhase === 3 && boss.hp <= 0) {
        triggerWin();
    }

    // 更新各類物件碰撞與位置...
    if (isLaserActive) {
        laserDuration--;
        if (laserDuration <= 0) isLaserActive = false;
    }

    // 發送 WebRTC 同步
    if (isMultiplayer && conn && conn.open && isHost) {
        conn.send({
            type: 'SYNC',
            boss: { x: boss.x, y: boss.y, hp: boss.hp, maxHp: boss.maxHp },
            player: { x: player.x, y: player.y, hp: player.hp },
            player2: { hp: player2.hp },
            bossPhase: bossPhase, gameOver: gameOver, gameWin: gameWin
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 繪製背景與邊界
    ctx.fillStyle = '#0d0f18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1e2230';
    ctx.fillRect(0, 0, playArea.left, canvas.height);
    ctx.fillRect(playArea.right, 0, canvas.width - playArea.right, canvas.height);

    // 繪製 Boss
    let currentBossImg = imgBoss1;
    if (bossPhase === 2) currentBossImg = imgBoss2;
    if (bossPhase === 3) currentBossImg = imgBoss3;
    if (currentBossImg.complete && currentBossImg.naturalWidth !== 0) {
        ctx.drawImage(currentBossImg, boss.x, boss.y, boss.width, boss.height);
    } else {
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
    }

    // 繪製雷射
    if (isLaserActive) {
        ctx.fillStyle = 'rgba(255, 215, 0, 0.7)';
        ctx.fillRect(boss.x + boss.width / 2 - 25, boss.y + boss.height, 50, canvas.height);
    }

    // 繪製玩家 1
    if (player.isAlive && imgPlayer.complete) {
        ctx.drawImage(imgPlayer, player.x, player.y, player.width, player.height);
    }

    // 繪製玩家 2
    if (isMultiplayer && player2.isAlive && imgPlayer2.complete) {
        ctx.drawImage(imgPlayer2, player2.x, player2.y, player2.width, player2.height);
    }

    // 繪製彈幕
    enemyBullets.forEach(b => {
        ctx.fillStyle = b.color || '#ff4757';
        ctx.fillRect(b.x - b.width / 2, b.y, b.width, b.height);
    });

    playerBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // 繪製 Boss 血條
    ctx.fillStyle = '#333';
    ctx.fillRect(playArea.left + 20, 10, playArea.width - 40, 12);
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(playArea.left + 20, 10, (playArea.width - 40) * (boss.hp / boss.maxHp), 12);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initWebRTC();
loop();
</script>
