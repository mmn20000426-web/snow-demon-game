<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會員制的打架 - 三階段 BOSS 戰</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 5px; background-color: #111; color: #fff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden;
        }
        h2 { margin: 2px 0 8px 0; color: #FFD700; text-align: center; font-size: 20px; }
        #main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 1000px; }
        #game-container {
            position: relative; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; width: min(100vw - 20px, 600px); flex-shrink: 0; z-index: 1;
        }
        canvas { background: #0d0f18; display: block; cursor: crosshair; width: 100%; height: auto; }
        .mobile-touch-bar {
            width: 100%; background: #1a1c23; display: flex; justify-content: space-around;
            padding: 6px; border-top: 2px solid #333a4e;
        }
        .mobile-btn {
            background: #1e90ff; color: white; border: none; padding: 8px 14px;
            font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s;
            user-select: none; touch-action: manipulation;
        }
        .mobile-btn:active { transform: scale(0.95); }
        .mobile-btn.control-btn { background: #ff4757; }
        .mobile-btn:disabled { background: #555 !important; color: #aaa; cursor: not-allowed; box-shadow: none; }
        #sidebar-container { display: flex; flex-direction: column; gap: 8px; width: min(100vw - 20px, 600px); }
        #achievement-section {
            background: #1a1c23; border: 2px solid #FFD700; border-radius: 6px;
            padding: 8px 10px; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        #achievement-section h3 { margin: 0 0 6px 0; color: #FFD700; text-align: center; font-size: 14px; }
        .achievement-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .achievement-card {
            background: #252836; border: 1px solid #444; border-radius: 4px;
            padding: 4px; text-align: center; font-size: 11px; color: #888; transition: all 0.3s ease;
        }
        .achievement-card.unlocked {
            background: #1e3799; border-color: #60a5fa; color: #fff; font-weight: bold;
            box-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
        }
        #control-panel-overlay { display: none; pointer-events: none; }
        #control-panel-overlay.active { display: flex !important; pointer-events: auto !important; }
        #control-panel {
            background: rgba(30, 34, 48, 0.98); border: 2px solid #ff4757;
            border-radius: 6px; padding: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            max-height: 480px; overflow-y: auto;
        }
        #control-panel h3 { margin-top: 0; margin-bottom: 8px; color: #FFD700; border-bottom: 1px solid #333a4e; padding-bottom: 4px; text-align: center; font-size: 14px; }
        .close-panel-btn { width: 100%; background: #ff4757; color: white; border: none; padding: 6px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .panel-section { margin-bottom: 8px; }
        .panel-section h4 { margin: 4px 0; color: #2ed573; font-size: 12px; }
        .toggle-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 11px; }
        .toggle-item label { cursor: pointer; }
        .toggle-item input[type="checkbox"] { cursor: pointer; width: 15px; height: 15px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .panel-btn { background: #3498db; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: background 0.2s; }
        .panel-btn:hover { background: #2980b9; }
        .panel-btn.success { background: #2ed573; color: #111; }
        .panel-btn.danger { background: #e74c3c; }

        @media (min-width: 850px) {
            #main-wrapper { flex-direction: row; align-items: flex-start; justify-content: center; }
            #sidebar-container { width: 320px; }
            .close-panel-btn { display: none; }
            #control-panel-overlay { display: block !important; pointer-events: auto !important; position: static !important; width: auto !important; height: auto !important; background: none !important; }
        }
        @media (max-width: 849px) {
            #control-panel-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; }
            #control-panel { width: 90%; max-width: 320px; max-height: 80vh; }
            .close-panel-btn { display: block; }
        }
        .instructions { margin-top: 4px; text-align: center; color: #aaa; font-size: 11px; }
    </style>
</head>
<body>

<h2>會員制的打架</h2>

<div id="main-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="mobile-touch-bar">
            <button id="btn-shield-ui" class="mobile-btn" onclick="trySummonShield()">🛡️ 護盾 [U]</button>
            <button class="mobile-btn control-btn" onclick="toggleControlPanel()">🎛️ 控制台 [I]</button>
        </div>
    </div>

    <div id="sidebar-container">
        <div id="achievement-section">
            <h3>🏆 遊戲成就解鎖</h3>
            <div class="achievement-grid">
                <div id="ach-1" class="achievement-card">🔒 沒交到壞朋友(喜)<br><small>(無開控制台)</small></div>
                <div id="ach-2" class="achievement-card">🔒 被無限餵石力(悲)<br><small>(無開控制台)</small></div>
                <div id="ach-3" class="achievement-card">🔒 低調的黑客</div>
                <div id="ach-4" class="achievement-card">🔒 怕不是桂口巴<br><small>(無開控制台)</small></div>
            </div>
        </div>

        <div id="control-panel-overlay">
            <div id="control-panel">
                <button class="close-panel-btn" onclick="toggleControlPanel()">❌ 關閉控制台</button>
                <h3 id="panel-title-status">🎛️ 控制台</h3>
                
                <div class="panel-section">
                    <h4>⚡ 即時狀態控制</h4>
                    <div class="toggle-item">
                        <label for="sw-pause-boss" style="color:#ff6b6b; font-weight:bold;">⏸️ 暫停 Boss 移動/攻擊</label>
                        <input type="checkbox" id="sw-pause-boss" onchange="markConsoleUsed()">
                    </div>
                    <button class="panel-btn success" style="width: 100%; margin-top: 4px;" onclick="healPlayerToFull()">💚 補滿玩家血量</button>
                </div>

                <div class="panel-section">
                    <h4>自動釋放開關</h4>
                    <div class="toggle-item"><label for="sw-orange">橘色扇形彈幕</label><input type="checkbox" id="sw-orange" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-green">綠色長條彈幕</label><input type="checkbox" id="sw-green" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-brown">咖啡圓形彈幕</label><input type="checkbox" id="sw-brown" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-pudding">追蹤布丁（封印區）</label><input type="checkbox" id="sw-pudding" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-laser">黃色雷射</label><input type="checkbox" id="sw-laser" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-burger">漢堡肉</label><input type="checkbox" id="sw-burger" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-noodle">麵條牆</label><input type="checkbox" id="sw-noodle" checked onchange="markConsoleUsed()"></div>
                    <div class="toggle-item"><label for="sw-medkit">急救包 Medkit</label><input type="checkbox" id="sw-medkit" checked onchange="markConsoleUsed()"></div>
                </div>

                <div class="panel-section">
                    <h4>手動即時觸發</h4>
                    <div class="btn-grid">
                        <button class="panel-btn" onclick="triggerLaser()">發射雷射</button>
                        <button class="panel-btn" onclick="triggerNoodles()">召喚麵條</button>
                        <button class="panel-btn" onclick="triggerBurger()">丟漢堡肉</button>
                        <button class="panel-btn" onclick="triggerMedkit()">掉落Medkit</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h4>除錯功能</h4>
                    <button class="panel-btn danger" style="width: 100%;" onclick="clearEnemyBullets()">清空敵方子彈</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="instructions">
    <p>🎮 拖曳畫面移動 | [U] 護盾 | [I] 開關控制台 | [P] 隱藏秒殺技能</p>
</div>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<audio id="loseBgm" src="lose.mp3" preload="auto"></audio>
<audio id="winBgm" src="win.mp3" preload="auto"></audio>
<audio id="win2Bgm" src="win2.mp3" preload="auto"></audio>
<audio id="win3Bgm" src="win3.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const bgm = document.getElementById('bgm');
const loseBgm = document.getElementById('loseBgm');
const winBgm = document.getElementById('winBgm');
const win2Bgm = document.getElementById('win2Bgm');
const win3Bgm = document.getElementById('win3Bgm');

const playArea = { left: 90, right: 510, width: 420 };

const imgPlayer = new Image(); imgPlayer.src = 'player.jpg';
const imgBoss1 = new Image(); imgBoss1.src = 'boss.jpg';
const imgBoss2 = new Image(); imgBoss2.src = 'boss2.jpg';
const imgBoss3 = new Image(); imgBoss3.src = 'boss3.jpg';
const imgGameOver = new Image(); imgGameOver.src = 'boss.jpg';  
const imgWin = new Image(); imgWin.src = 'win.jpg';
const imgWin2 = new Image(); imgWin2.src = 'win2.jpg';
const imgWin3 = new Image(); imgWin3.src = 'win3.jpg';
const imgShield = new Image(); imgShield.src = 'shield.jpg';
const imgMedkit = new Image(); imgMedkit.src = 'medkit.jpg';

const npcImages = {
    npc1: new Image(), npc2: new Image(), npc3: new Image(),
    bnpc1: new Image(), bnpc2: new Image(), bnpc3: new Image()
};
npcImages.npc1.src = 'npc1.jpg';
npcImages.npc2.src = 'npc2.jpg';
npcImages.npc3.src = 'npc3.jpg';
npcImages.bnpc1.src = 'bnpc1.jpg';
npcImages.bnpc2.src = 'bnpc2.jpg';
npcImages.bnpc3.src = 'bnpc3.jpg';

let gameStarted = false;
let score = 0;
let gameOver = false;
let gameWin = false;
let isPausedForPanel = false;
let frameCount = 0;

let hasUsedConsole = false;
let tookDamage = false;
const unlockedAchievements = { ach1: false, ach2: false, ach3: false, ach4: false };

const keys = {};

let npc3SpecialTextTimer = null;
let isNpc3SpecialText = false;

let shieldCooldown = 0;
const SHIELD_CD_MAX = 120; 
const bossWallY = 130;

// 階段變數
let bossPhase = 1;

// QTE 變數
let qteActive = false;
let qteTimer = 0; // 240 幀 (4秒)
let qteSequence = [];
let qteIndex = 0;
let qteResultText = '';
let qteLaserActive = false;
let qteLaserTimer = 0;
let qteNpc3Shield = null;
let bnpcDefeated = false;

const player = {
    x: playArea.left + playArea.width / 2 - 22,
    y: canvas.height - 80,
    width: 44,
    height: 44,
    baseSpeed: 6,
    speed: 6,
    radius: 9,
    hp: 25,
    maxHp: 25,
    invincibleFrame: 0
};

const boss = {
    x: playArea.left + playArea.width / 2 - 35,
    y: 35,
    width: 70,
    height: 70,
    dir: 1,
    speed: 2.5,
    hp: 50,
    maxHp: 50
};

const shields = [];
const enemyBullets = [];  
const playerBullets = []; 
const puddings = [];       
const sealZones = [];      
const burgerSteaks = [];   
const noodles = [];        
const medkits = [];        

let laserTimer = 0;
let isLaserActive = false;
let laserDuration = 0;

let isResettingSwitches = false;

function markConsoleUsed() {
    if (!isResettingSwitches) hasUsedConsole = true;
}

function toggleControlPanel() {
    const overlay = document.getElementById('control-panel-overlay');
    const isMobile = window.innerWidth < 850;

    if (isMobile) {
        const isActive = overlay.classList.contains('active');
        if (isActive) {
            overlay.classList.remove('active');
            isPausedForPanel = false;
        } else {
            overlay.classList.add('active');
            isPausedForPanel = true;
        }
    } else {
        isPausedForPanel = !isPausedForPanel;
    }

    const panelTitle = document.getElementById('panel-title-status');
    if (panelTitle) {
        panelTitle.innerText = isPausedForPanel ? "🎛️ 控制台 (遊戲暫停中)" : "🎛️ 控制台";
    }
}

function unlockAchievement(id, key, text) {
    if (!unlockedAchievements[key]) {
        unlockedAchievements[key] = true;
        const el = document.getElementById(id);
        if (el) {
            el.classList.add('unlocked');
            el.innerHTML = `🏆 ${text}`;
        }
    }
}

function healPlayerToFull() {
    markConsoleUsed();
    player.hp = player.maxHp;
}

function triggerLaser() {
    markConsoleUsed();
    isLaserActive = true;
    laserDuration = 45;
}

function triggerNoodles() {
    markConsoleUsed();
    for (let i = 0; i < 4; i++) {
        noodles.push({
            x: Math.random() * (playArea.width - 60) + playArea.left + 30,
            y: Math.random() * (canvas.height - 300) + 180,
            width: 18,
            height: 75,
            angle: Math.random() * Math.PI,
            duration: 360
        });
    }
}

function triggerBurger() {
    markConsoleUsed();
    const startX = boss.x + boss.width / 2;
    const startY = boss.y + boss.height;
    const targetX = Math.random() * (playArea.width - 80) + playArea.left + 40;
    const targetY = Math.random() * (canvas.height - 250) + 150;
    const angle = Math.atan2(targetY - startY, targetX - startX);

    burgerSteaks.push({
        x: startX, y: startY, targetX: targetX, targetY: targetY,
        vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
        width: 38, height: 26, isStationary: false, stayDuration: 180
    });
}

function triggerMedkit() {
    markConsoleUsed();
    medkits.push({
        x: Math.random() * (playArea.width - 35) + playArea.left + 15,
        y: -30, vy: 2.5, width: 30, height: 30
    });
}

function clearEnemyBullets() {
    markConsoleUsed();
    enemyBullets.length = 0;
}

function resetControlPanelSwitches() {
    isResettingSwitches = true;
    document.getElementById('sw-pause-boss').checked = false;
    document.getElementById('sw-orange').checked = true;
    document.getElementById('sw-green').checked = true;
    document.getElementById('sw-brown').checked = true;
    document.getElementById('sw-pudding').checked = true;
    document.getElementById('sw-laser').checked = true;
    document.getElementById('sw-burger').checked = true;
    document.getElementById('sw-noodle').checked = true;
    document.getElementById('sw-medkit').checked = true;
    isResettingSwitches = false;
}

// 根據當前階段獲取彈幕頻率 multiplier (數值越小發射越快) 與 冷卻時間 multiplier
function getPhaseMultipliers() {
    if (bossPhase === 1) return { freq: 1 / 0.75, cd: 1.0 };          // 0.75 倍射速
    if (bossPhase === 2) return { freq: 1 / 1.3, cd: 0.75 };         // 1.3 倍射速，0.75 倍冷卻
    if (bossPhase === 3) return { freq: 1 / 0.65, cd: 1.5 };         // 0.65 倍射速，1.5 倍冷卻
    return { freq: 1.0, cd: 1.0 };
}

function spawnEnemyBullets() {
    if (qteActive) return;
    const isBossPaused = document.getElementById('sw-pause-boss').checked;
    if (isBossPaused) return;

    const mult = getPhaseMultipliers();

    const swOrange = document.getElementById('sw-orange').checked;
    const swGreen = document.getElementById('sw-green').checked;
    const swBrown = document.getElementById('sw-brown').checked;
    const swPudding = document.getElementById('sw-pudding').checked;
    const swLaser = document.getElementById('sw-laser').checked;
    const swBurger = document.getElementById('sw-burger').checked;
    const swNoodle = document.getElementById('sw-noodle').checked;
    const swMedkit = document.getElementById('sw-medkit').checked;

    if (swOrange && frameCount % Math.max(1, Math.round(25 * mult.freq)) === 0) {
        const count = 3;
        const startAngle = Math.PI * 0.35;
        const endAngle = Math.PI * 0.65;
        const step = count > 1 ? (endAngle - startAngle) / (count - 1) : 0;

        for (let i = 0; i < count; i++) {
            const angle = startAngle + step * i;
            enemyBullets.push({
                x: boss.x + boss.width / 2, y: boss.y + boss.height,
                vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4,
                width: 35, height: 10, angle: angle, color: '#FF7F50', type: 'rect', damage: 1
            });
        }
    }

    if (swGreen && frameCount % Math.max(1, Math.round(28 * mult.freq)) === 0) {
        enemyBullets.push({
            x: Math.random() * (playArea.width - 30) + playArea.left + 15,
            y: 0, vx: 0, vy: 7, width: 12, height: 45, angle: 0, color: '#2ed573', type: 'rect', damage: 1
        });
    }

    if (swBrown && frameCount % Math.max(1, Math.round(20 * mult.freq)) === 0) {
        enemyBullets.push({
            x: boss.x + boss.width / 2, y: boss.y + boss.height,
            vx: (Math.random() - 0.5) * 3, vy: 5, radius: 6, color: '#8B4513', type: 'circle', damage: 1
        });
    }

    if (swPudding && frameCount % Math.max(1, Math.round(180 * mult.freq)) === 0) {
        const targetX = player.x + player.width / 2;
        const targetY = player.y + player.height / 2;
        const startX = boss.x + boss.width / 2;
        const startY = boss.y + boss.height;
        const angle = Math.atan2(targetY - startY, targetX - startX);

        puddings.push({
            x: startX, y: startY, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, radius: 16
        });
    }

    if (swLaser) {
        laserTimer++;
        if (laserTimer >= Math.round(540 * mult.cd)) {
            isLaserActive = true;
            laserDuration = 45;
            laserTimer = 0;
        }
    }

    if (swBurger && frameCount % Math.max(1, Math.round(360 * mult.cd)) === 0) {
        const startX = boss.x + boss.width / 2;
        const startY = boss.y + boss.height;
        const targetX = Math.random() * (playArea.width - 80) + playArea.left + 40;
        const targetY = Math.random() * (canvas.height - 250) + 150;
        const angle = Math.atan2(targetY - startY, targetX - startX);

        burgerSteaks.push({
            x: startX, y: startY, targetX: targetX, targetY: targetY,
            vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
            width: 38, height: 26, isStationary: false, stayDuration: 180
        });
    }

    if (swNoodle && frameCount % Math.max(1, Math.round(360 * mult.cd)) === 0) {
        for (let i = 0; i < 4; i++) {
            noodles.push({
                x: Math.random() * (playArea.width - 60) + playArea.left + 30,
                y: Math.random() * (canvas.height - 300) + 180,
                width: 18, height: 75, angle: Math.random() * Math.PI, duration: 360
            });
        }
    }

    if (swMedkit && frameCount % 240 === 0) {
        medkits.push({
            x: Math.random() * (playArea.width - 35) + playArea.left + 15,
            y: -30, vy: 2.5, width: 30, height: 30
        });
    }
}

function startQTE() {
    qteActive = true;
    qteTimer = 240; // 4 秒 (60 FPS)
    qteIndex = 0;
    qteResultText = '';
    qteLaserActive = false;
    qteNpc3Shield = null;
    enemyBullets.length = 0;

    const availableKeys = ['W', 'A', 'S', 'D', 'J', 'K', 'L', 'U'];
    qteSequence = [];
    for (let i = 0; i < 4; i++) {
        const randIndex = Math.floor(Math.random() * availableKeys.length);
        qteSequence.push(availableKeys[randIndex]);
    }
}

function handleQTEInput(pressedKey) {
    if (!qteActive) return;

    const expected = qteSequence[qteIndex];
    if (pressedKey.toUpperCase() === expected) {
        qteIndex++;
        if (qteIndex >= qteSequence.length) {
            // QTE 成功！
            qteActive = false;
            triggerQTESuccess();
        }
    }
}

function triggerQTESuccess() {
    qteNpc3Shield = {
        x: playArea.left + 10,
        y: player.y - 40,
        width: playArea.width - 20,
        height: 12
    };

    qteLaserActive = true;
    qteLaserTimer = 90; // 播放 1.5 秒反彈動畫

    setTimeout(() => {
        bnpcDefeated = true; // bnpc1、bnpc2 消失
        bossPhase = 3;
        boss.hp = 30;
        boss.maxHp = 30;
        qteLaserActive = false;
        qteNpc3Shield = null;
    }, 1500);
}

function triggerQTEFail() {
    qteActive = false;
    triggerGameOver();
}

function firePlayerBullet() {
    if (qteActive) return;
    playerBullets.push({
        x: player.x + player.width / 2, y: player.y, vy: -10, radius: 5, color: '#FFD700'
    });
}

function trySummonShield() {
    if (shieldCooldown > 0 || isPausedForPanel || qteActive) return;

    shields.push({
        x: player.x + player.width / 2 - 25, y: player.y - 50, width: 50, height: 45
    });

    shieldCooldown = SHIELD_CD_MAX;
    isNpc3SpecialText = true;
    if (npc3SpecialTextTimer) clearTimeout(npc3SpecialTextTimer);
    npc3SpecialTextTimer = setTimeout(() => { isNpc3SpecialText = false; }, 1500);
}

function playBGM() {
    if (gameStarted && !gameOver && !gameWin) {
        bgm.play().catch(() => {});
    }
}

function triggerGameOver() {
    gameOver = true;
    if (!hasUsedConsole) {
        unlockAchievement('ach-2', 'ach2', '被無限餵石力(悲)');
    }
    bgm.pause(); bgm.currentTime = 0;
    loseBgm.currentTime = 0; loseBgm.play().catch(() => {});
}

function triggerWin() {
    boss.hp = 0;
    gameWin = true;
    bgm.pause(); bgm.currentTime = 0;

    if (hasUsedConsole) {
        unlockAchievement('ach-3', 'ach3', '低調的黑客');
        win2Bgm.currentTime = 0; win2Bgm.play().catch(() => {});
    } else if (!tookDamage) {
        unlockAchievement('ach-1', 'ach1', '沒交到壞朋友(喜)');
        unlockAchievement('ach-4', 'ach4', '怕不是桂口巴');
        win3Bgm.currentTime = 0; win3Bgm.play().catch(() => {});
    } else {
        unlockAchievement('ach-1', 'ach1', '沒交到壞朋友(喜)');
        winBgm.currentTime = 0; winBgm.play().catch(() => {});
    }
}

function startGame() {
    if (!gameStarted) {
        gameStarted = true;
        playBGM();
    }
}

window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === ' ') e.preventDefault();

    startGame();
    keys[e.key] = true;
    keys[e.code] = true;

    if (qteActive) {
        handleQTEInput(e.key);
        return;
    }

    if (e.key === 'u' || e.key === 'U' || e.code === 'KeyU') {
        if (!gameOver && !gameWin) trySummonShield();
    }
    if (e.key === 'i' || e.key === 'I' || e.code === 'KeyI') toggleControlPanel();
    if (e.key === 'p' || e.key === 'P' || e.code === 'KeyP') {
        if (!gameOver && !gameWin) triggerWin();
    }
    if ((gameOver || gameWin) && (e.code === 'Space' || e.code === 'Enter')) resetGame();
});

window.addEventListener('keyup', e => {
    keys[e.key] = false;
    keys[e.code] = false;
});

let isDragging = false;
canvas.addEventListener('mousedown', e => {

    if (gameOver || gameWin) { resetGame(); return; }
    if (isPausedForPanel) return;

});

canvas.addEventListener('mousemove', e => {

});

window.addEventListener('mouseup', () => isDragging = false);

canvas.addEventListener('touchstart', e => {
    startGame();

    if (isPausedForPanel) return;
    isDragging = true;

}, { passive: false });

canvas.addEventListener('touchmove', e => {

}, { passive: false });

window.addEventListener('touchend', () => isDragging = false);

function updatePlayerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const touchX = (evt.clientX - rect.left) * scaleX;
    const touchY = (evt.clientY - rect.top) * scaleY;

    player.x = touchX - player.width / 2;
    player.y = touchY - player.height / 2;
}

function resetGame() {
    score = 0; gameOver = false; gameWin = false;
    isPausedForPanel = false; frameCount = 0; shieldCooldown = 0;
    hasUsedConsole = false; tookDamage = false;

    bossPhase = 1;
    qteActive = false;
    qteLaserActive = false;
    bnpcDefeated = false;

    resetControlPanelSwitches();

    const overlay = document.getElementById('control-panel-overlay');
    if (overlay) overlay.classList.remove('active');

    enemyBullets.length = 0; playerBullets.length = 0; shields.length = 0;
    puddings.length = 0; sealZones.length = 0; burgerSteaks.length = 0;
    noodles.length = 0; medkits.length = 0;
    laserTimer = 0; isLaserActive = false; laserDuration = 0;

    player.x = playArea.left + playArea.width / 2 - 22;
    player.y = canvas.height - 80;
    player.maxHp = 25;
    player.hp = player.maxHp;
    player.invincibleFrame = 0;
    player.speed = player.baseSpeed;

    boss.x = playArea.left + playArea.width / 2 - 35;
    boss.hp = 50; boss.maxHp = 50;

function checkPointRectCollision(px, py, rect) {
    if (rect.type === 'circle') {
        const dx = px - rect.x; const dy = py - rect.y;
        return Math.sqrt(dx * dx + dy * dy) < rect.radius + player.radius;
    } else {
        const halfW = (rect.width || 20) / 2;
        const halfH = (rect.height || 10) / 2;
        return (px > rect.x - halfW - 4 && px < rect.x + halfW + 4 && py > rect.y - halfH - 4 && py < rect.y + halfH + 4);
    }
}

function checkAABBCollision(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y
    );
}

function checkPointNoodleCollision(px, py, nd) {
    const cx = nd.x; const cy = nd.y;
    const cos = Math.cos(-nd.angle); const sin = Math.sin(-nd.angle);
    const dx = px - cx; const dy = py - cy;
    const rx = cos * dx - sin * dy; const ry = sin * dx + cos * dy;
    return Math.abs(rx) <= nd.width / 2 + 5 && Math.abs(ry) <= nd.height / 2 + 5;
}

function checkShieldCollision(shield, eb) {
    const w = eb.width || (eb.radius * 2);
    const h = eb.height || (eb.radius * 2);
    return (
        eb.x + w / 2 > shield.x && eb.x - w / 2 < shield.x + shield.width &&
        eb.y + h / 2 > shield.y && eb.y - h / 2 < shield.y + shield.height
    );
}

function update() {
    if (!gameStarted || gameOver || gameWin || isPausedForPanel) return;

    frameCount++;
    score++;

    if (shieldCooldown > 0) shieldCooldown--;

    const shieldBtn = document.getElementById('btn-shield-ui');
    if (shieldBtn) {
        if (shieldCooldown > 0) {
            shieldBtn.innerText = `🛡️ 冷卻中 (${(shieldCooldown / 60).toFixed(1)}s)`;
            shieldBtn.disabled = true;
        } else {
            shieldBtn.innerText = `🛡️ 護盾 [U]`;
            shieldBtn.disabled = false;
        }
    }

    if (player.invincibleFrame > 0) player.invincibleFrame--;

    // QTE 倒數計時處理
    if (qteActive) {
        qteTimer--;
        if (qteTimer <= 0) {
            triggerQTEFail();
            return;
        }
    }

    let inSeal = false;
    const playerCenterX = player.x + player.width / 2;
    const playerCenterY = player.y + player.height / 2;

    for (let i = sealZones.length - 1; i >= 0; i--) {
        const zone = sealZones[i];
        zone.duration--;
        const dx = playerCenterX - zone.x; const dy = playerCenterY - zone.y;
        if (Math.sqrt(dx * dx + dy * dy) < zone.radius) inSeal = true;
        if (zone.duration <= 0) sealZones.splice(i, 1);
    }

    player.speed = inSeal ? player.baseSpeed * 0.4 : player.baseSpeed;

    const oldX = player.x; const oldY = player.y;

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;

    if ((keys['Space'] || keys['KeySpace']) && frameCount % 8 === 0) firePlayerBullet();
    if (isDragging && frameCount % 8 === 0) firePlayerBullet();

    player.x = Math.max(playArea.left, Math.min(playArea.right - player.width, player.x));
    player.y = Math.max(bossWallY, Math.min(canvas.height - player.height, player.y));

    for (let nd of noodles) {
        if (checkPointNoodleCollision(player.x + player.width / 2, player.y + player.height / 2, nd)) {
            player.x = oldX; player.y = oldY; break;
        }
    }

    shields.forEach(s => {
        s.x = player.x + player.width / 2 - s.width / 2;
        s.y = player.y - s.height - 5;
    });

    const isBossPaused = document.getElementById('sw-pause-boss').checked;
    if (!isBossPaused && !qteActive) {
        boss.x += boss.speed * boss.dir;
        if (boss.x <= playArea.left + 10 || boss.x + boss.width >= playArea.right - 10) {
            boss.dir *= -1;
        }
    }

    spawnEnemyBullets();

    for (let i = noodles.length - 1; i >= 0; i--) {
        noodles[i].duration--;
        if (noodles[i].duration <= 0) noodles.splice(i, 1);
    }

    for (let i = medkits.length - 1; i >= 0; i--) {
        const m = medkits[i];
        m.y += m.vy;
        if (checkAABBCollision(player, m)) {
            player.hp = Math.min(player.maxHp, player.hp + 1);
            medkits.splice(i, 1);
            continue;
        }
        if (m.y > canvas.height + 50) medkits.splice(i, 1);
    }

    if (isLaserActive) {
        laserDuration--;
        const laserX = boss.x + boss.width / 2;
        const laserWidth = 30;

        if (
            player.invincibleFrame === 0 &&
            playerCenterX > laserX - laserWidth / 2 &&
            playerCenterX < laserX + laserWidth / 2 &&
            playerCenterY > boss.y + boss.height
        ) {
            player.hp -= 2; tookDamage = true;
            player.invincibleFrame = 30;
            if (player.hp <= 0) { triggerGameOver(); return; }
        }
        if (laserDuration <= 0) isLaserActive = false;
    }

    for (let i = burgerSteaks.length - 1; i >= 0; i--) {
        const b = burgerSteaks[i];
        if (!b.isStationary) {
            b.x += b.vx; b.y += b.vy;
            const distToTarget = Math.sqrt(Math.pow(b.x - b.targetX, 2) + Math.pow(b.y - b.targetY, 2));
            if (distToTarget < 10) { b.x = b.targetX; b.y = b.targetY; b.isStationary = true; }
        } else {
            b.stayDuration--;
            if (b.stayDuration <= 0) { burgerSteaks.splice(i, 1); continue; }
        }

        enemyBullets.forEach(eb => {
            if (
                eb.x > b.x - b.width / 2 && eb.x < b.x + b.width / 2 &&
                eb.y > b.y - b.height / 2 && eb.y < b.y + b.height / 2
            ) {
                eb.damage = 2; eb.isEnhanced = true;
            }
        });
    }

    for (let i = puddings.length - 1; i >= 0; i--) {
        const p = puddings[i];
        p.x += p.vx; p.y += p.vy;

        const dx = playerCenterX - p.x; const dy = playerCenterY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let hitPlayer = false;
        if (player.invincibleFrame === 0 && dist < p.radius + player.radius) {
            player.hp -= 2; tookDamage = true;
            player.invincibleFrame = 30; hitPlayer = true;
            if (player.hp <= 0) { triggerGameOver(); return; }
        }

        if (hitPlayer || p.y >= canvas.height - 20 || p.x <= playArea.left || p.x >= playArea.right) {
            sealZones.push({ x: p.x, y: p.y, radius: 45, duration: 180 });
            puddings.splice(i, 1);
        }
    }

    // 玩家子彈與 Boss 傷害判斷（含階段轉換）
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const pb = playerBullets[i];
        pb.y += pb.vy;

        let blockedByNoodle = false;
        for (let nd of noodles) {
            if (checkPointNoodleCollision(pb.x, pb.y, nd)) { blockedByNoodle = true; break; }
        }
        if (blockedByNoodle) { playerBullets.splice(i, 1); continue; }

        if (pb.x > boss.x && pb.x < boss.x + boss.width && pb.y > boss.y && pb.y < boss.y + boss.height) {
            boss.hp--;
            playerBullets.splice(i, 1);

            // 階段一 ➔ 階段二 (血量 <= 10)
            if (bossPhase === 1 && boss.hp <= 10) {
                bossPhase = 2;
                player.maxHp += 10;
                player.hp += 10;
                boss.hp = 80;
                boss.maxHp = 80;
            }
            // 階段二 ➔ 觸發 QTE (血量 <= 0)
            else if (bossPhase === 2 && boss.hp <= 0) {
                boss.hp = 0;
                startQTE();
            }
            // 階段三 ➔ 獲勝 (血量 <= 0)
            else if (bossPhase === 3 && boss.hp <= 0) {
                triggerWin();
                return;
            }
            continue;
        }
        if (pb.y < -10) playerBullets.splice(i, 1);
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx; eb.y += eb.vy;

        let blockedByNoodle = false;
        for (let nd of noodles) {
            if (checkPointNoodleCollision(eb.x, eb.y, nd)) { blockedByNoodle = true; break; }
        }
        if (blockedByNoodle) { enemyBullets.splice(i, 1); continue; }

        let blockedByShield = false;
        for (let j = shields.length - 1; j >= 0; j--) {
            if (checkShieldCollision(shields[j], eb)) {
                shields.splice(j, 1); enemyBullets.splice(i, 1);
                blockedByShield = true; break;
            }
        }
        if (blockedByShield) continue;

        if (player.invincibleFrame === 0) {
            if (checkPointRectCollision(playerCenterX, playerCenterY, eb)) {
                player.hp -= (eb.damage || 1); tookDamage = true;
                player.invincibleFrame = 30; enemyBullets.splice(i, 1);
                if (player.hp <= 0) { triggerGameOver(); return; }
                continue;
            }
        }

        if (eb.y > canvas.height + 50 || eb.y < -50 || eb.x < -50 || eb.x > canvas.width + 50) {
            enemyBullets.splice(i, 1);
        }
    }
}

function drawWineGlass(x, y) {
    ctx.save();
    ctx.strokeStyle = '#ffffff'; ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 12, y - 25); ctx.lineTo(x + 12, y - 25); ctx.lineTo(x, y - 10);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.stroke();
    ctx.restore();
}

function drawSpeechBubble(text, x, y, alignLeft = true) {
    ctx.save();
    ctx.font = 'bold 11px "Microsoft JhengHei", Arial';
    const textWidth = ctx.measureText(text).width;
    const padding = 5;
    const bubbleW = textWidth + padding * 2;
    const bubbleH = 20;
    let bubbleX = alignLeft ? x + 8 : x - bubbleW - 8;
    let bubbleY = y - 10;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(bubbleX, bubbleY, bubbleW, bubbleH, 4);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#111'; ctx.textAlign = 'center';
    ctx.fillText(text, bubbleX + bubbleW / 2, bubbleY + 14);
    ctx.restore();
}

function drawAllNPCs() {
    const npcW = 50; const npcH = 50;
    let leftX = 15; let rightX = 535;

    // 二階段 QTE 期間，bnpc1 與 bnpc2 站在戰場左右兩側
    if (qteActive) {
        leftX = playArea.left + 10;
        rightX = playArea.right - 60;
    }

    const leftPositions = [
        { key: 'npc1', y: 110 },
        { key: 'npc2', y: 260 },
        { key: 'npc3', y: 410 }
    ];

    const rightPositions = [
        { key: 'bnpc1', y: 110 },
        { key: 'bnpc2', y: 260 },
        { key: 'bnpc3', y: 410 }
    ];

    leftPositions.forEach(item => {
        let text = "我修院加油啊!";
        if (gameOver) text = "哎呀!!害死我力";
        else if (gameWin) text = "好結局";
        else if (item.key === 'npc3' && isNpc3SpecialText) text = "鴨蛋摸鴨蛋，牡蠣摸牡蠣";

        const img = npcImages[item.key];
        if (img.complete && img.naturalWidth !== 0) ctx.drawImage(img, leftX, item.y, npcW, npcH);
        else { ctx.fillStyle = '#9b59b6'; ctx.fillRect(leftX, item.y, npcW, npcH); }
        drawSpeechBubble(text, leftX + npcW / 2, item.y - 10, true);
    });

    if (!bnpcDefeated) {
        rightPositions.forEach(item => {
            let text = "淳平君加油啊!";
            if (qteActive && (item.key === 'bnpc1' || item.key === 'bnpc2')) text = "看招！秒殺雷射！";
            else if (gameOver) text = "哎呀!!害死我力";
            else if (gameWin) text = "壞結局";

            const img = npcImages[item.key];
            if (img.complete && img.naturalWidth !== 0) ctx.drawImage(img, rightX, item.y, npcW, npcH);
            else { ctx.fillStyle = '#e67e22'; ctx.fillRect(rightX, item.y, npcW, npcH); }
            drawSpeechBubble(text, rightX + npcW / 2, item.y - 10, false);
        });
    }
}

function drawQTEOverlay() {
    if (!qteActive) return;

    ctx.save();
    ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 召喚預備黃色雷射視覺
    ctx.fillStyle = 'rgba(255, 230, 0, 0.5)';
    ctx.fillRect(playArea.left, 0, playArea.width, canvas.height);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`⚠️ QTE 警告！按對 4 個按鍵發動 NPC3 盾牌！`, canvas.width / 2, 180);

    const secondsLeft = (qteTimer / 60).toFixed(1);
    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 28px Arial';
    ctx.fillText(`剩餘時間: ${secondsLeft}s`, canvas.width / 2, 220);

    // 繪製 QTE 按鍵序列
    const startX = canvas.width / 2 - (qteSequence.length * 30);
    qteSequence.forEach((keyChar, idx) => {
        const boxX = startX + idx * 60;
        const boxY = 250;

        if (idx < qteIndex) ctx.fillStyle = '#2ed573';
        else if (idx === qteIndex) ctx.fillStyle = '#FFD700';
        else ctx.fillStyle = '#555555';

        ctx.fillRect(boxX, boxY, 50, 50);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, boxY, 50, 50);

        ctx.fillStyle = '#111111';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(keyChar, boxX + 25, boxY + 34);
    });

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    for (let i = 0; i < 20; i++) {
        const sx = (Math.sin(i * 99 + frameCount * 0.05) * 0.5 + 0.5) * canvas.width;
        const sy = ((i * 35 + frameCount * 3) % canvas.height);
        ctx.fillRect(sx, sy, 2, 2);
    }

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playArea.left, 0); ctx.lineTo(playArea.left, canvas.height);
    ctx.moveTo(playArea.right, 0); ctx.lineTo(playArea.right, canvas.height);
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 71, 87, 0.6)';
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(playArea.left, bossWallY);
    ctx.lineTo(playArea.right, bossWallY);
    ctx.stroke();
    ctx.restore();

    sealZones.forEach(z => {
        ctx.fillStyle = 'rgba(211, 84, 0, 0.35)';
        ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f39c12'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
        ctx.fillText('封印中', z.x, z.y + 4);
    });

    noodles.forEach(nd => {
        ctx.save();
        ctx.translate(nd.x, nd.y); ctx.rotate(nd.angle);
        ctx.fillStyle = '#F1C40F'; ctx.strokeStyle = '#D35400'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(-nd.width / 2, -nd.height / 2, nd.width, nd.height, 8);
        ctx.fill(); ctx.stroke();
        ctx.restore();
    });

    medkits.forEach(m => {
        if (imgMedkit.complete && imgMedkit.naturalWidth !== 0) ctx.drawImage(imgMedkit, m.x, m.y, m.width, m.height);
        else {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(m.x, m.y, m.width, m.height);
            ctx.fillStyle = '#2ed573'; ctx.fillRect(m.x + 12, m.y + 5, 6, 20);
            ctx.fillRect(m.x + 5, m.y + 12, 20, 6);
        }
    });

    if (isLaserActive) {
        const laserX = boss.x + boss.width / 2;
        ctx.fillStyle = 'rgba(255, 242, 0, 0.3)';
        ctx.fillRect(laserX - 22, boss.y + boss.height, 44, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(laserX - 12, boss.y + boss.height, 24, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(laserX - 4, boss.y + boss.height, 8, canvas.height);
        drawWineGlass(laserX, boss.y - 5);
    }

    if (!gameStarted) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 26px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('點擊螢幕開始遊戲', canvas.width / 2, canvas.height / 2);
        ctx.textAlign = 'left';
        drawAllNPCs();
        return;
    }

    // 根據階段選取對應 Boss 圖片
    let currentBossImg = imgBoss1;
    if (bossPhase === 2) currentBossImg = imgBoss2;
    if (bossPhase === 3) currentBossImg = imgBoss3;

    if (currentBossImg.complete && currentBossImg.naturalWidth !== 0) {
        ctx.drawImage(currentBossImg, boss.x, boss.y, boss.width, boss.height);
    } else {
        ctx.fillStyle = bossPhase === 1 ? '#ff4757' : (bossPhase === 2 ? '#e74c3c' : '#8e44ad');
        ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
    }

    // Boss 血條
    ctx.fillStyle = '#333';
    ctx.fillRect(boss.x, boss.y - 12, boss.width, 6);
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(boss.x, boss.y - 12, (Math.max(0, boss.hp) / boss.maxHp) * boss.width, 6);

    shields.forEach(s => {
        if (imgShield.complete && imgShield.naturalWidth !== 0) ctx.drawImage(imgShield, s.x, s.y, s.width, s.height);
        else { ctx.fillStyle = '#1e90ff'; ctx.fillRect(s.x, s.y, s.width, s.height); }
    });

    if (player.invincibleFrame % 4 < 2) {
        if (imgPlayer.complete && imgPlayer.naturalWidth !== 0) ctx.drawImage(imgPlayer, player.x, player.y, player.width, player.height);
        else { ctx.fillStyle = '#00d2ff'; ctx.fillRect(player.x, player.y, player.width, player.height); }
    }

    ctx.fillStyle = '#2ed573';
    ctx.beginPath();
    ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 3, 0, Math.PI * 2);
    ctx.fill();

    playerBullets.forEach(pb => {
        ctx.fillStyle = pb.color;
        ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.radius, 0, Math.PI * 2); ctx.fill();
    });

    enemyBullets.forEach(eb => {
        if (eb.isEnhanced) { ctx.save(); ctx.shadowColor = '#ff4757'; ctx.shadowBlur = 10; }
        ctx.fillStyle = eb.isEnhanced ? '#ff4757' : eb.color;
        if (eb.type === 'rect') {
            ctx.save(); ctx.translate(eb.x, eb.y); ctx.rotate(eb.angle);
            ctx.fillRect(-eb.width / 2, -eb.height / 2, eb.width, eb.height);
            ctx.restore();
        } else {
            ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2); ctx.fill();
        }
        if (eb.isEnhanced) ctx.restore();
    });

    puddings.forEach(p => {
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#7e5109';
        ctx.beginPath(); ctx.arc(p.x, p.y - p.radius * 0.3, p.radius * 0.6, 0, Math.PI * 2); ctx.fill();
    });

    burgerSteaks.forEach(b => {
        ctx.save();
        ctx.strokeStyle = '#FFFF00'; ctx.lineWidth = 3.5; ctx.fillStyle = '#5c3317';
        ctx.beginPath(); ctx.roundRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height, 8);
        ctx.fill(); ctx.stroke(); ctx.restore();
    });

    // UI 資訊顯示
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(`SCORE: ${score}`, playArea.left + 15, 30);

    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, playArea.left + 15, 55);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 14px "Microsoft JhengHei", Arial';
    ctx.fillText(`階段: ${bossPhase} / 3`, playArea.left + 15, 75);

    drawAllNPCs();
    drawQTEOverlay();
    drawQTEReflection();

    if (isPausedForPanel && !gameOver && !gameWin) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 26px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⏸️ 遊戲暫停中 (控制台開啟)', canvas.width / 2, canvas.height / 2);
        ctx.textAlign = 'left';
    }

    if (gameWin) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let winText = "恭喜你成功打敗雪之惡魔(喜)";
        let winImage = imgWin;

        if (hasUsedConsole) {
            winText = "你作弊了，對吧?";
            winImage = imgWin2;
        } else if (!tookDamage) {
            winText = "恭喜你獲得先輩超人的愛慕";
            winImage = imgWin3;
        }

        if (winImage.complete && winImage.naturalWidth !== 0) {
            ctx.drawImage(winImage, (canvas.width - 240) / 2, 120, 240, 200);
        }

        ctx.fillStyle = '#2ed573';
        ctx.font = 'bold 26px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText(winText, canvas.width / 2, 390);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px "Microsoft JhengHei", Arial';
        ctx.fillText('點擊重新開始', canvas.width / 2, 440);
        ctx.textAlign = 'left';
    }

    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (imgGameOver.complete && imgGameOver.naturalWidth !== 0) {
            ctx.drawImage(imgGameOver, (canvas.width - 360) / 2, 40, 360, 360);
        }

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 30px "Microsoft JhengHei", Arial';
        ctx.textAlign = 'center';
        ctx.fillText('被無盡的厥力(悲)', canvas.width / 2, 450);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px "Microsoft JhengHei", Arial';
        ctx.fillText('點擊重新開始', canvas.width / 2, 500);
        ctx.textAlign = 'left';
    }
}

function animate() {
    update();
    draw();
    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
